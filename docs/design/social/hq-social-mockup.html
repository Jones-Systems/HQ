<!doctype html>
<html lang="en" data-theme="system">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HQ Social — desktop mockup (fictional fixtures)</title>
<!--
  Preliminary design mockup for HQ Social. Everything here is fictional fixture
  data held in page memory. No network requests, accounts, collection or posting.
  Token names are provisional semantic roles until the HQ visual system lands.
  Spec: hq-social-design.md in this directory.
-->
<style>
:root{
  --hq-font:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,"Liberation Sans",sans-serif;
  --hq-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --hq-radius:8px;--hq-radius-sm:5px;
  /* Light chrome roles (provisional) */
  --hq-surface-base:#f6f6f3;--hq-surface-raised:#ffffff;--hq-surface-sunken:#ecece7;--hq-surface-rail:#e7e7e1;
  --hq-text-primary:#1b1d20;--hq-text-muted:#596069;--hq-border:#d9d9d2;--hq-border-strong:#bdbdb4;
  --hq-accent:#2d5bc9;--hq-accent-text:#ffffff;--hq-accent-soft:#e3eafb;--hq-accent-ink:#1f469f;
  --hq-focus:#1f5fff;--hq-success:#1d7347;--hq-success-soft:#e1f2e8;--hq-warning:#8a5a00;--hq-warning-soft:#fbefd5;
  --hq-danger:#b42318;--hq-danger-soft:#fbe4e1;--hq-info-soft:#e6eef8;--hq-shadow:0 1px 2px rgba(20,20,20,.06),0 4px 16px rgba(20,20,20,.06);
  /* Social-specific role */
  --social-future:#6b5aa6;--social-future-soft:#ece8f7;
}
:root[data-resolved="dark"]{
  --hq-surface-base:#131417;--hq-surface-raised:#1b1d21;--hq-surface-sunken:#0f1012;--hq-surface-rail:#0c0d0f;
  --hq-text-primary:#eceef0;--hq-text-muted:#a3a9b1;--hq-border:#2c2f35;--hq-border-strong:#40444c;
  --hq-accent:#8eb0ff;--hq-accent-text:#0b1530;--hq-accent-soft:#1d2a47;--hq-accent-ink:#b5caff;
  --hq-focus:#9fbcff;--hq-success:#6fd19b;--hq-success-soft:#15301f;--hq-warning:#f0c066;--hq-warning-soft:#33280f;
  --hq-danger:#ff8f84;--hq-danger-soft:#3a1714;--hq-info-soft:#172235;--hq-shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);
  --social-future:#b9a8f2;--social-future-soft:#262040;
}
*{box-sizing:border-box}
:root{color-scheme:light}
:root[data-resolved="dark"]{color-scheme:dark}
html,body{margin:0;height:100%}
body{font:14px/1.45 var(--hq-font);background:var(--hq-surface-base);color:var(--hq-text-primary);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--hq-focus);outline-offset:2px;border-radius:4px}
.skip{position:absolute;left:-9999px;top:8px;z-index:50;background:var(--hq-surface-raised);padding:8px 12px;border-radius:6px}
.skip:focus{left:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.app{display:grid;grid-template-columns:64px 236px minmax(0,1fr);height:100vh}
/* HQ rail (shell-owned; shown for context only) */
.rail{background:var(--hq-surface-rail);border-right:1px solid var(--hq-border);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:6px}
.rail .mark{width:36px;height:36px;border-radius:9px;background:var(--hq-text-primary);color:var(--hq-surface-base);display:grid;place-items:center;font-weight:700;font-size:13px;margin-bottom:10px;letter-spacing:.02em}
.rail-btn{width:52px;border:0;background:none;border-radius:8px;padding:7px 0 5px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:var(--hq-text-muted);font-size:11px}
.rail-btn svg{width:20px;height:20px}
.rail-btn:hover{background:var(--hq-surface-sunken);color:var(--hq-text-primary)}
.rail-btn[aria-current="true"]{background:var(--hq-surface-raised);color:var(--hq-text-primary);box-shadow:inset 3px 0 0 var(--hq-accent)}
.rail-spacer{flex:1}
.appearance{position:relative}
.appearance-menu{position:absolute;left:58px;bottom:0;background:var(--hq-surface-raised);border:1px solid var(--hq-border);border-radius:var(--hq-radius);box-shadow:var(--hq-shadow);padding:10px;width:200px;z-index:30}
.appearance-menu legend{font-size:12px;color:var(--hq-text-muted);padding:0 0 6px}
.appearance-menu fieldset{border:0;margin:0;padding:0}
.appearance-menu label{display:flex;gap:8px;align-items:center;padding:5px 4px;border-radius:5px;cursor:pointer}
.appearance-menu label:hover{background:var(--hq-surface-sunken)}
.appearance-menu small{display:block;color:var(--hq-text-muted);margin-top:6px;font-size:11.5px}
/* Social domain navigation */
.dnav{background:var(--hq-surface-raised);border-right:1px solid var(--hq-border);display:flex;flex-direction:column;min-height:0}
.dnav-head{padding:16px 14px 10px;border-bottom:1px solid var(--hq-border)}
.domain-label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--hq-text-muted);font-weight:600}
.brand-select{margin-top:8px;display:flex;align-items:center;gap:8px}
.brand-chip{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;font-weight:700;font-size:11px;background:var(--hq-accent-soft);color:var(--hq-accent-ink);flex:none}
.brand-select select{flex:1;min-width:0;border:1px solid var(--hq-border);background:var(--hq-surface-raised);border-radius:6px;padding:5px 6px;font-weight:600}
.brand-link{font-size:11.5px;color:var(--hq-text-muted);margin-top:6px}
.dnav nav{padding:10px 8px;display:flex;flex-direction:column;gap:2px;overflow:auto}
.dnav nav .group{font-size:11px;color:var(--hq-text-muted);padding:12px 8px 4px;letter-spacing:.06em;text-transform:uppercase}
.dnav a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:6px;color:var(--hq-text-primary);text-decoration:none}
.dnav a:hover{background:var(--hq-surface-sunken)}
.dnav a[aria-current="page"]{background:var(--hq-accent-soft);color:var(--hq-accent-ink);font-weight:600}
.dnav a .count{margin-left:auto;font-size:11.5px;color:var(--hq-text-muted);font-weight:500}
.dnav a .ico{width:16px;height:16px;flex:none;opacity:.85}
.dnav-foot{margin-top:auto;padding:12px 14px;border-top:1px solid var(--hq-border);font-size:12px;color:var(--hq-text-muted)}
.dnav-foot strong{color:var(--hq-text-primary);font-weight:600;display:block;margin-bottom:2px}
/* Main column */
.col{display:flex;flex-direction:column;min-width:0;min-height:0}
.topbar{display:flex;align-items:center;gap:12px;padding:10px 20px;border-bottom:1px solid var(--hq-border);background:var(--hq-surface-raised);min-height:52px}
.crumb{font-size:13px;color:var(--hq-text-muted)}
.crumb strong{color:var(--hq-text-primary)}
.topbar .grow{flex:1}
.ctx{display:flex;align-items:center;gap:6px;border:1px solid var(--hq-border);border-radius:999px;padding:3px 10px 3px 6px;font-size:12.5px;background:var(--hq-surface-base)}
.ctx .dot{width:8px;height:8px;border-radius:50%;background:var(--hq-success)}
.ctx.down .dot{background:var(--hq-danger)}
.ctx-label{color:var(--hq-text-muted)}
main{flex:1;overflow:auto;padding:20px 24px 96px;min-height:0}
main:focus{outline:none}
h1{font-size:21px;margin:0 0 2px;letter-spacing:-.01em}
h2{font-size:15px;margin:0 0 10px}
h3{font-size:13.5px;margin:0 0 6px}
.sub{color:var(--hq-text-muted);margin:0 0 16px;max-width:760px}
.page-head{display:flex;align-items:flex-end;gap:16px;margin-bottom:16px}
.page-head>div:first-child{flex:1}
.page-head .sub{margin:2px 0 0}
/* Controls */
.btn{border:1px solid var(--hq-border-strong);background:var(--hq-surface-raised);border-radius:6px;padding:6px 12px;cursor:pointer;font-weight:550;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--hq-surface-sunken)}
.btn.primary{background:var(--hq-accent);color:var(--hq-accent-text);border-color:var(--hq-accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--hq-surface-sunken)}
.btn.sm{padding:3px 8px;font-size:12.5px}
.btn.danger{color:var(--hq-danger)}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.55;cursor:not-allowed;filter:none}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field>span{font-weight:600;font-size:12.5px}
.field .hint{font-weight:400;color:var(--hq-text-muted);font-size:12px}
.field input,.field select,.field textarea,.input{border:1px solid var(--hq-border-strong);background:var(--hq-surface-raised);border-radius:6px;padding:7px 9px;width:100%}
.field textarea{resize:vertical;min-height:72px;line-height:1.5}
.field input[aria-invalid="true"],.field textarea[aria-invalid="true"],.field select[aria-invalid="true"]{border-color:var(--hq-danger);box-shadow:0 0 0 1px var(--hq-danger)}
.err{color:var(--hq-danger);font-size:12.5px}
.row{display:flex;gap:12px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.card{background:var(--hq-surface-raised);border:1px solid var(--hq-border);border-radius:var(--hq-radius);padding:14px 16px}
.card.flush{padding:0;overflow:hidden}
.card-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.card-head h2{margin:0;flex:1}
.muted{color:var(--hq-text-muted)}
.small{font-size:12.5px}
.mono{font-family:var(--hq-mono);font-size:12px}
.tag{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 8px;font-size:11.5px;font-weight:600;border:1px solid var(--hq-border);background:var(--hq-surface-base);color:var(--hq-text-muted);white-space:nowrap}
.tag.ok{background:var(--hq-success-soft);color:var(--hq-success);border-color:transparent}
.tag.warn{background:var(--hq-warning-soft);color:var(--hq-warning);border-color:transparent}
.tag.bad{background:var(--hq-danger-soft);color:var(--hq-danger);border-color:transparent}
.tag.info{background:var(--hq-accent-soft);color:var(--hq-accent-ink);border-color:transparent}
.tag.future{background:var(--social-future-soft);color:var(--social-future);border-color:transparent}
.tag.example{border-style:dashed}
.ch{display:inline-grid;place-items:center;min-width:24px;height:18px;padding:0 4px;border-radius:4px;font-size:10.5px;font-weight:700;border:1px solid var(--hq-border-strong);color:var(--hq-text-muted);background:var(--hq-surface-raised)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
ul.plain{list-style:none;margin:0;padding:0}
.list-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--hq-border)}
.list-row:first-child{border-top:0}
.list-row .grow{flex:1;min-width:0}
.trunc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--hq-border);vertical-align:top}
th{font-size:12px;color:var(--hq-text-muted);font-weight:600;background:var(--hq-surface-base);position:sticky;top:0}
tbody tr:hover{background:var(--hq-surface-base)}
tr.sel{background:var(--hq-accent-soft)!important}
td button.linkish,.linkish{background:none;border:0;padding:0;color:var(--hq-accent-ink);font-weight:600;cursor:pointer;text-align:left}
.linkish:hover{text-decoration:underline}
.banner{display:flex;gap:10px;align-items:flex-start;border-radius:var(--hq-radius);padding:10px 14px;margin-bottom:14px;border:1px solid transparent}
.banner.info{background:var(--hq-info-soft);border-color:var(--hq-border)}
.banner.warn{background:var(--hq-warning-soft)}
.banner.bad{background:var(--hq-danger-soft)}
.banner .grow{flex:1}
.banner strong{display:block}
.capstrip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:16px}
.cap{border:1px solid var(--hq-border);border-radius:var(--hq-radius);padding:10px 12px;background:var(--hq-surface-raised)}
.cap .k{font-size:12px;color:var(--hq-text-muted)}
.cap .v{font-weight:650;margin-top:2px;display:flex;gap:6px;align-items:center}
.empty{border:1px dashed var(--hq-border-strong);border-radius:var(--hq-radius);padding:36px 24px;text-align:center;background:var(--hq-surface-raised)}
.empty h2{margin-bottom:4px}
.empty p{color:var(--hq-text-muted);margin:0 auto 14px;max-width:460px}
.skel{background:linear-gradient(90deg,var(--hq-surface-sunken),var(--hq-surface-raised),var(--hq-surface-sunken));background-size:200% 100%;animation:sk 1.4s infinite;border-radius:6px}
@keyframes sk{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}
/* Two-pane layouts */
.split{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}
.lib{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start}
.wb{display:grid;grid-template-columns:240px minmax(0,1fr);gap:16px;align-items:start}
.side-list{background:var(--hq-surface-raised);border:1px solid var(--hq-border);border-radius:var(--hq-radius);overflow:hidden}
.side-list .filters{padding:10px;border-bottom:1px solid var(--hq-border);display:flex;flex-direction:column;gap:8px;background:var(--hq-surface-base)}
.side-list button.item{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--hq-border);background:none;padding:10px 12px;cursor:pointer}
.side-list button.item:hover{background:var(--hq-surface-base)}
.side-list button.item[aria-current="true"]{background:var(--hq-accent-soft);box-shadow:inset 3px 0 0 var(--hq-accent)}
.side-list .item-title{font-weight:600;display:flex;gap:6px;align-items:center}
.side-list .item-meta{font-size:12px;color:var(--hq-text-muted);display:flex;gap:6px;align-items:center;margin-top:3px;flex-wrap:wrap}
.unsaved-dot{width:7px;height:7px;border-radius:50%;background:var(--hq-warning);display:inline-block}
.wb-group{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--hq-text-muted);padding:10px 12px 4px;background:var(--hq-surface-base);border-bottom:1px solid var(--hq-border)}
.tool-mark{width:26px;height:26px;border-radius:6px;display:grid;place-items:center;font-size:10.5px;font-weight:700;background:var(--hq-surface-sunken);color:var(--hq-text-primary);flex:none}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--hq-border);margin-bottom:14px}
.tabs button{border:0;background:none;padding:8px 12px;cursor:pointer;color:var(--hq-text-muted);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;gap:6px;align-items:center}
.tabs button[aria-selected="true"]{color:var(--hq-text-primary);border-bottom-color:var(--hq-accent)}
.stepper{display:flex;gap:6px;align-items:center;font-size:12.5px;margin:6px 0 12px}
.stepper .s{padding:2px 8px;border-radius:999px;border:1px solid var(--hq-border);color:var(--hq-text-muted)}
.stepper .s.on{background:var(--hq-accent-soft);color:var(--hq-accent-ink);border-color:transparent;font-weight:650}
.stepper .s.done{color:var(--hq-success);border-color:transparent;background:var(--hq-success-soft)}
.stepper .s.bad{color:var(--hq-danger);background:var(--hq-danger-soft);border-color:transparent}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;font-size:13px}
.kv dt{color:var(--hq-text-muted)}
.kv dd{margin:0}
/* Composer */
.composer{background:var(--hq-surface-raised);border:1px solid var(--hq-border);border-radius:var(--hq-radius)}
.composer-head{padding:12px 16px;border-bottom:1px solid var(--hq-border);display:flex;gap:10px;align-items:center}
.composer-head input.title{flex:1;font-size:17px;font-weight:650;border:1px solid transparent;background:none;padding:4px 6px;border-radius:6px}
.composer-head input.title:hover,.composer-head input.title:focus{border-color:var(--hq-border-strong)}
.composer-body{display:grid;grid-template-columns:minmax(0,1fr) 290px}
.composer-main{padding:14px 16px;border-right:1px solid var(--hq-border);min-width:0}
.composer-side{padding:14px 16px;display:flex;flex-direction:column;gap:16px}
.counter{font-size:12px;color:var(--hq-text-muted);text-align:right;margin-top:-6px;margin-bottom:8px}
.counter.over{color:var(--hq-danger);font-weight:650}
.checks li{display:flex;gap:8px;align-items:flex-start;padding:3px 0;font-size:12.5px}
.savebar{position:sticky;bottom:0;z-index:5;display:flex;align-items:center;gap:10px;padding:10px 16px;border-top:1px solid var(--hq-border);background:var(--hq-surface-base);border-radius:0 0 var(--hq-radius) var(--hq-radius)}
.savebar .grow{flex:1}
.save-state{font-size:12.5px;display:flex;gap:6px;align-items:center}
.artwork{border-radius:6px;overflow:hidden;border:1px solid var(--hq-border);display:block}
.ref{border:1px solid var(--hq-border);border-radius:6px;padding:8px 10px;font-size:12.5px;background:var(--hq-surface-base)}
.ref .t{font-weight:600}
.ref .m{color:var(--hq-text-muted);font-size:12px;margin-top:2px}
/* Calendar */
.cal{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:16px;align-items:start}
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--hq-border);border-radius:var(--hq-radius);overflow:hidden;background:var(--hq-border);gap:1px}
.month .dow{background:var(--hq-surface-base);font-size:11.5px;color:var(--hq-text-muted);padding:6px 8px;font-weight:600}
.day{background:var(--hq-surface-raised);min-height:104px;padding:5px 6px;display:flex;flex-direction:column;gap:4px}
.day.out{background:var(--hq-surface-base)}
.day.out .dn{opacity:.5}
.day .dn{font-size:12px;font-weight:600;color:var(--hq-text-muted)}
.day.today .dn{color:var(--hq-accent-text);background:var(--hq-accent);border-radius:999px;padding:0 6px;align-self:flex-start}
.day.drop{outline:2px dashed var(--hq-accent);outline-offset:-3px}
.evt{display:flex;gap:5px;align-items:center;width:100%;border:1px solid var(--hq-border);border-left:3px solid var(--hq-accent);background:var(--hq-surface-base);border-radius:5px;padding:3px 5px;font-size:12px;cursor:grab;text-align:left}
.evt.ready{border-left-color:var(--hq-success)}
.evt.idea{border-left-color:var(--hq-border-strong)}
.evt .trunc{flex:1;min-width:0}
.day .evt{align-items:flex-start}
.day .evt .trunc{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.3}
.tray{background:var(--hq-surface-raised);border:1px solid var(--hq-border);border-radius:var(--hq-radius);padding:12px;display:flex;flex-direction:column;gap:6px}
.tray.drop{outline:2px dashed var(--hq-accent)}
/* Channels */
.chan{display:flex;flex-direction:column;gap:8px}
.chan ul li{display:flex;gap:8px;justify-content:space-between;padding:4px 0;border-top:1px solid var(--hq-border);font-size:12.5px}
/* Other domains placeholder */
.placeholder{max-width:620px;margin:48px auto;text-align:center}
/* Toast, dialogs, mock controls */
#toast{position:fixed;left:50%;bottom:62px;transform:translateX(-50%);background:var(--hq-text-primary);color:var(--hq-surface-base);padding:9px 14px;border-radius:8px;display:flex;gap:12px;align-items:center;box-shadow:var(--hq-shadow);z-index:40;font-size:13px}
#toast[hidden]{display:none}
#toast button{background:none;border:0;color:inherit;font-weight:700;text-decoration:underline;cursor:pointer}
dialog{border:1px solid var(--hq-border);border-radius:10px;background:var(--hq-surface-raised);color:var(--hq-text-primary);padding:0;width:min(560px,92vw);box-shadow:var(--hq-shadow)}
dialog::backdrop{background:rgba(10,12,16,.45)}
.dlg-head{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid var(--hq-border);gap:8px}
.dlg-head h2{margin:0;flex:1}
.dlg-body{padding:16px}
.dlg-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--hq-border);background:var(--hq-surface-base);border-radius:0 0 10px 10px}
.mock{position:fixed;right:14px;bottom:12px;z-index:35;background:var(--hq-surface-raised);border:1px dashed var(--hq-border-strong);border-radius:10px;box-shadow:var(--hq-shadow);padding:6px 10px;font-size:12px}

const G = { ok: '<path d="M5 12.5l4.5 4.5L19 7.5"/>', bad: '<path d="M7 7l10 10M17 7L7 17"/>', warn: '<path d="M12 5.5v8M12 18.5v.01"/>', queued: '<circle cx="12" cy="12" r="6"/>', running: '<path d="M12 5a7 7 0 1 1-7 7"/>', unknown: '<path d="M9.2 9.2a3 3 0 1 1 4.2 2.7c-.8.4-1.4 1-1.4 1.9M12 18.5v.01"/>' };

function toast(msg, undo) {

}
function buf(id) {

function dirty(id) {

function fieldValue(t, f) {
  const form = S.wbForm[t.id] || (S.wbForm[t.id] = {});
  if (form[f.k] !== undefined) return form[f.k];
  let v = '';
  if (f.prefill === 'p.topics') v = brand().profile.topics.join(', ');
  else if (f.prefill === 'p.audience') v = brand().profile.audience;
  else if (f.prefill === 'brand') v = brand().name;
  else if (f.type === 'source') v = (sources().find((s) => s.kind === t.kind) || {}).id || '';
  else if (f.type === 'date') { const s = sources().find((x) => x.id === fieldValue(t, { k: 'source', type: 'source' })); v = s ? s.asOf : ''; }
  else if (f.type === 'select') v = f.opts[0];
  form[f.k] = v; return v;
}
function wbForm(t) {
  const errs = S.wbErrors[t.id] || {}; const fields = FIELDS[t.id];
  const avail = t.kind ? sources().filter((s) => s.kind === t.kind) : [];
  if (t.kind && !avail.length) return `<div class="empty" style="padding:22px"><h2>No ${esc(KINDS[t.kind].toLowerCase())} imported</h2><p>This workbench needs ${esc(KINDS[t.kind].toLowerCase())} for ${esc(brand().name)}. Import a file, or run the labeled fictional example.</p><div class="row" style="justify-content:center"><button class="btn primary" data-action="import">Import data</button><button class="btn" data-action="run-example">Run fictional example</button></div></div>`;
  return `<form id="wb-form" novalidate data-tool="${t.id}">
    ${Object.keys(errs).length ? `<div class="banner bad small" role="alert" id="wb-errsum"><div><strong>Fix ${Object.keys(errs).length} field${Object.keys(errs).length > 1 ? 's' : ''} before running</strong>${Object.values(errs).map(esc).join(' · ')}</div></div>` : ''}
    <div class="grid2">${fields.map((f) => {
      const v = fieldValue(t, f), id = `f-${t.id}-${f.k}`, e = errs[f.k];
      const aria = `id="${id}" name="${f.k}" ${e ? `aria-invalid="true" aria-describedby="${id}-e"` : ''} ${f.req ? 'aria-required="true"' : ''}`;
      let input;
      if (f.type === 'source') input = `<select ${aria}>${avail.map((s) => `<option value="${s.id}" ${s.id === v ? 'selected' : ''}>${esc(s.name)} · ${s.records} records · as of ${esc(s.asOf)}</option>`).join('')}</select>`;
      else if (f.type === 'select') input = `<select ${aria}>${f.opts.map((o) => `<option ${o === v ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`;

}
function openShortcuts() {
  dialog('Keyboard shortcuts', `<table><tbody>${[['Ctrl/⌘ 1 · 2 · 3', 'Switch to Design, Social, Work (HQ shell)'], ['N', 'New draft'], ['Ctrl/⌘ S', 'Save draft (Library)'], ['Tab / Shift Tab', 'Move between controls'], ['Enter on a calendar draft', 'Open, or move to another date'], ['Esc', 'Close dialog or menu'], ['?', 'This list']].map(([k, v]) => `<tr><td><span class="kbd">${esc(k)}</span></td><td>${esc(v)}</td></tr>`).join('')}</tbody></table>`);
}

/* ---------- Boot ---------- */
fromHash();
document.querySelectorAll('input[name="appearance"]').forEach((r) => { r.checked = r.value === S.appearance; });
render();
</script>
</body>
