<!doctype html>
<html lang="en" data-appearance="system">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HQ · Work — interactive design mockup</title>
<!--
  HQ Work design mockup. Fictional records only. Not production source.
  The fixture adapter mirrors the Manual Planner HTTP semantics (revision guard,
  server-owned order with neighbour anchors, request ids, undo) so interactions
  can be inspected. It has no execution port: card capture, drag, reorder,
  status/list changes and navigation make zero execution calls.
  See ../hq-work-design.md and ../adapter-boundary.md.
-->
<style>
/* ---------------------------------------------------------------- tokens */
/* Shell roles (--hq-*) are provisional until the shared style lane publishes
   its tokens; Work roles (--work-*) carry Manual Planner's palette forward. */
:root {
  --hq-base: #f4f3ee; --hq-raised: #ffffff; --hq-raised-2: #fbfaf7; --hq-sunken: #ebe9e2; --hq-rail: #e6e4dc;
  --hq-border: #dedbd1; --hq-border-strong: #c9c4b7;
  --hq-text: #1c1e22; --hq-text-2: #474b54; --hq-muted: #686d77;
  --hq-accent: #3a50c9; --hq-accent-text: #ffffff; --hq-accent-soft: #e6e9fa; --hq-accent-line: #c3cbf1;
  --hq-focus: #3a50c9; --hq-success: #1d7a45; --hq-warning: #8c540a; --hq-danger: #b8322a; --hq-danger-soft: #fbe9e7;
  --hq-warning-soft: #fbf0dc;
  --hq-shadow-sm: 0 1px 2px rgba(28,30,34,.07), 0 1px 1px rgba(28,30,34,.04);
  --hq-shadow: 0 6px 18px rgba(28,30,34,.10), 0 1px 3px rgba(28,30,34,.06);
  --hq-shadow-lg: 0 22px 48px rgba(28,30,34,.20), 0 4px 10px rgba(28,30,34,.08);

  --work-need: #b0441a; --work-need-bg: #fbeae2; --work-want: #0b6b62; --work-want-bg: #dff2ee;
  --work-exploring: #6a3fc4; --work-exploring-bg: #eee8fb;
  --work-st-inbox: #7c828d; --work-st-considering: #b07d14; --work-st-next: #3366d0; --work-st-active: #1c8f4d;
  --work-st-on_hold: #7f58c9; --work-st-done: #4f7f66; --work-st-dropped: #979ba3;
  --work-dk-target: #0e6f8a; --work-dk-deadline: #8d520f; --work-dk-start: #4a760e; --work-dk-event: #7135d6;
  --work-col: #ebe9e2; --work-card: #ffffff; --work-dock: #f9f8f4;

  --radius: 10px; --radius-sm: 7px; --radius-lg: 14px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Liberation Sans", "Noto Sans", system-ui, sans-serif;
  --mono: "SF Mono", Menlo, Consolas, "Liberation Mono", ui-monospace, monospace;
  color-scheme: light;
}
:root[data-appearance="dark"] {
  --hq-base: #111317; --hq-raised: #1b1e24; --hq-raised-2: #1f2229; --hq-sunken: #15171c; --hq-rail: #0c0d10;
  --hq-border: #2a2f38; --hq-border-strong: #3b414c;
  --hq-text: #e8eaef; --hq-text-2: #b8bec9; --hq-muted: #8f97a4;
  --hq-accent: #8c9bff; --hq-accent-text: #0f1430; --hq-accent-soft: rgba(140,155,255,.15); --hq-accent-line: rgba(140,155,255,.42);
  --hq-focus: #a3afff; --hq-success: #5fd08f; --hq-warning: #e3a84f; --hq-danger: #ff7a6e; --hq-danger-soft: rgba(255,122,110,.13);
  --hq-warning-soft: rgba(227,168,79,.13);
  --hq-shadow-sm: 0 1px 2px rgba(0,0,0,.45); --hq-shadow: 0 8px 22px rgba(0,0,0,.42); --hq-shadow-lg: 0 24px 52px rgba(0,0,0,.6);
  --work-need: #ff9466; --work-need-bg: rgba(255,148,102,.14); --work-want: #4fd1c0; --work-want-bg: rgba(79,209,192,.13);
  --work-exploring: #b99bff; --work-exploring-bg: rgba(185,155,255,.15);
  --work-st-inbox: #8f96a3; --work-st-considering: #e0b04a; --work-st-next: #6e9bff; --work-st-active: #4cc985;
  --work-st-on_hold: #ad8bf0; --work-st-done: #7fb69a; --work-st-dropped: #6f7580;
  --work-dk-target: #4fc3dc; --work-dk-deadline: #e3a84f; --work-dk-start: #9bd35a; --work-dk-event: #b99bff;
  --work-col: #16191e; --work-card: #20242b; --work-dock: #181b21;
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :root[data-appearance="system"] {
    --hq-base: #111317; --hq-raised: #1b1e24; --hq-raised-2: #1f2229; --hq-sunken: #15171c; --hq-rail: #0c0d10;
    --hq-border: #2a2f38; --hq-border-strong: #3b414c;
    --hq-text: #e8eaef; --hq-text-2: #b8bec9; --hq-muted: #8f97a4;
    --hq-accent: #8c9bff; --hq-accent-text: #0f1430; --hq-accent-soft: rgba(140,155,255,.15); --hq-accent-line: rgba(140,155,255,.42);
    --hq-focus: #a3afff; --hq-success: #5fd08f; --hq-warning: #e3a84f; --hq-danger: #ff7a6e; --hq-danger-soft: rgba(255,122,110,.13);
    --hq-warning-soft: rgba(227,168,79,.13);
    --hq-shadow-sm: 0 1px 2px rgba(0,0,0,.45); --hq-shadow: 0 8px 22px rgba(0,0,0,.42); --hq-shadow-lg: 0 24px 52px rgba(0,0,0,.6);
    --work-need: #ff9466; --work-need-bg: rgba(255,148,102,.14); --work-want: #4fd1c0; --work-want-bg: rgba(79,209,192,.13);
    --work-exploring: #b99bff; --work-exploring-bg: rgba(185,155,255,.15);
    --work-st-inbox: #8f96a3; --work-st-considering: #e0b04a; --work-st-next: #6e9bff; --work-st-active: #4cc985;
    --work-st-on_hold: #ad8bf0; --work-st-done: #7fb69a; --work-st-dropped: #6f7580;
    --work-dk-target: #4fc3dc; --work-dk-deadline: #e3a84f; --work-dk-start: #9bd35a; --work-dk-event: #b99bff;
    --work-col: #16191e; --work-card: #20242b; --work-dock: #181b21;
    color-scheme: dark;
  }
}

/* ---------------------------------------------------------------- base */
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font: 14px/1.4 var(--font); color: var(--hq-text); background: var(--hq-base); -webkit-font-smoothing: antialiased; overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--hq-focus); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg.ic { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
kbd { font: 11px var(--mono); padding: 1px 5px; border: 1px solid var(--hq-border-strong); border-bottom-width: 2px; border-radius: 4px; background: var(--hq-raised); color: var(--hq-text-2); }

.btn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: var(--radius-sm); border: 1px solid var(--hq-border); background: var(--hq-raised); color: var(--hq-text); font-weight: 500; white-space: nowrap; }
.btn:hover { border-color: var(--hq-border-strong); }
.btn-primary { background: var(--hq-accent); border-color: var(--hq-accent); color: var(--hq-accent-text); }
.btn-primary:hover { filter: brightness(1.06); border-color: var(--hq-accent); }
.btn-ghost { background: transparent; border-color: transparent; color: var(--hq-text-2); }
.btn-ghost:hover { background: var(--hq-sunken); border-color: transparent; color: var(--hq-text); }
.btn-icon { width: 32px; padding: 0; justify-content: center; }
.btn-sm { height: 26px; padding: 0 9px; font-size: 12.5px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.input, .select, .textarea { border: 1px solid var(--hq-border); background: var(--hq-raised); border-radius: var(--radius-sm); padding: 6px 9px; min-height: 32px; width: 100%; }
.input:focus, .select:focus, .textarea:focus { outline: none; border-color: var(--hq-accent); box-shadow: 0 0 0 3px var(--hq-accent-soft); }
.textarea { resize: vertical; line-height: 1.5; }

/* ---------------------------------------------------------------- shell */
.hq { display: grid; grid-template-columns: 60px 216px minmax(0, 1fr); height: 100vh; }
.rail { background: var(--hq-rail); border-right: 1px solid var(--hq-border); display: flex; flex-direction: column; align-items: center; padding: 10px 0; gap: 4px; }
.rail-mark { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; font: 700 13px var(--font); letter-spacing: .02em; background: var(--hq-text); color: var(--hq-base); margin-bottom: 10px; }
.rail-item { width: 48px; padding: 6px 0 5px; border: 0; background: none; border-radius: 10px; display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--hq-muted); font-size: 10.5px; font-weight: 600; position: relative; }
.rail-item svg.ic { width: 20px; height: 20px; }
.rail-item:hover { color: var(--hq-text); background: var(--hq-sunken); }
.rail-item[aria-current="page"] { color: var(--hq-text); background: var(--hq-raised); box-shadow: var(--hq-shadow-sm); }
.rail-item[aria-current="page"]::before { content: ""; position: absolute; left: -6px; top: 10px; bottom: 10px; width: 3px; border-radius: 3px; background: var(--hq-accent); }
.rail-spacer { flex: 1; }

.work-nav { background: var(--hq-raised-2); border-right: 1px solid var(--hq-border); display: flex; flex-direction: column; min-height: 0; }
.work-nav-head { padding: 16px 16px 6px; }
.work-nav-head h1 { font-size: 15px; margin: 0; letter-spacing: -.01em; }
.work-nav-head p { margin: 2px 0 0; color: var(--hq-muted); font-size: 12px; }
.nav-group { padding: 8px 8px 4px; }
.nav-label { font-size: 11px; font-weight: 650; text-transform: uppercase; letter-spacing: .06em; color: var(--hq-muted); padding: 6px 8px 4px; display: flex; align-items: center; gap: 6px; }
.nav-item { white-space: nowrap; display: flex; align-items: center; gap: 9px; width: 100%; height: 32px; padding: 0 8px; border-radius: var(--radius-sm); border: 0; background: none; color: var(--hq-text-2); text-align: left; }
.nav-item:hover { background: var(--hq-sunken); color: var(--hq-text); }
.nav-item[aria-current="page"] { background: var(--hq-accent-soft); color: var(--hq-text); font-weight: 600; }
.nav-item[aria-current="page"] svg.ic { color: var(--hq-accent); }
.nav-item .key { margin-left: auto; font: 11px var(--mono); color: var(--hq-muted); }
.nav-item .count { margin-left: auto; font-size: 12px; color: var(--hq-muted); }
.tag-proposed { font-size: 9.5px; font-weight: 650; letter-spacing: .04em; text-transform: uppercase; padding: 1px 6px; border-radius: 999px; border: 1px dashed var(--hq-border-strong); color: var(--hq-muted); }
.nav-foot { margin-top: auto; padding: 10px 12px 12px; border-top: 1px solid var(--hq-border); display: grid; gap: 8px; }
.conn { display: flex; gap: 8px; align-items: flex-start; font-size: 12px; color: var(--hq-text-2); }
.conn-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--hq-success); margin-top: 5px; flex: none; }
.conn.is-off .conn-dot { background: var(--hq-danger); }
.conn small { display: block; color: var(--hq-muted); font-size: 11.5px; }

.work-main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.topbar { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--hq-border); background: var(--hq-raised-2); min-height: 56px; }
.ctx { display: flex; align-items: center; gap: 8px; min-width: 0; }
.ctx-chip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--hq-border); background: var(--hq-raised); font-size: 12.5px; font-weight: 550; white-space: nowrap; }
.ctx-chip .dot { width: 8px; height: 8px; border-radius: 3px; background: #c66b3d; }
.ctx-note { font-size: 12px; color: var(--hq-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top-spacer { flex: 1; }
.search { position: relative; width: 240px; }
.search input { padding-left: 30px; height: 32px; }
.search svg { position: absolute; left: 9px; top: 8px; color: var(--hq-muted); }
.view-select { display: none; width: auto; }

.banner { display: flex; align-items: center; gap: 10px; padding: 9px 16px; font-size: 13px; border-bottom: 1px solid var(--hq-border); }
.banner[hidden] { display: none; }
.banner.is-off { background: var(--hq-danger-soft); color: var(--hq-text); }
.banner.is-info { background: var(--hq-warning-soft); }
.banner strong { font-weight: 650; }

#view { flex: 1; min-height: 0; overflow: auto; position: relative; }

/* ---------------------------------------------------------------- board */
.board-head { display: flex; align-items: center; gap: 12px; padding: 14px 18px 10px; flex-wrap: wrap; }
.board-head h2 { margin: 0; font-size: 17px; letter-spacing: -.01em; }
.seg { display: inline-flex; max-width: 100%; overflow-x: auto; padding: 2px; border-radius: 9px; background: var(--hq-sunken); border: 1px solid var(--hq-border); }
.seg button { flex: none; white-space: nowrap; border: 0; background: none; height: 28px; padding: 0 11px; border-radius: 7px; color: var(--hq-text-2); font-size: 12.5px; font-weight: 550; display: inline-flex; gap: 6px; align-items: center; }
.seg button[aria-pressed="true"] { background: var(--hq-raised); color: var(--hq-text); box-shadow: var(--hq-shadow-sm); }
.board-hint { font-size: 12px; color: var(--hq-muted); margin-left: auto; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }

.board { display: flex; align-items: flex-start; gap: 12px; padding: 0 18px 24px; min-height: calc(100% - 60px); }
.col { width: 276px; flex: none; background: var(--work-col); border-radius: var(--radius-lg); display: flex; flex-direction: column; max-height: calc(100vh - 182px); border: 1px solid transparent; }
.col.col-dock { background: var(--work-dock); border-color: var(--hq-border); box-shadow: var(--hq-shadow-sm); }
.col.drop-active { border-color: var(--hq-accent-line); box-shadow: 0 0 0 3px var(--hq-accent-soft); }
.col-head { display: flex; align-items: center; gap: 6px; padding: 10px 8px 6px 12px; }
.col-name { font-weight: 650; font-size: 13.5px; display: flex; align-items: center; gap: 7px; }
.st-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--st, var(--work-st-inbox)); flex: none; }
.col-count { font-size: 12px; color: var(--hq-muted); font-variant-numeric: tabular-nums; }
.col-head .btn-icon { width: 26px; height: 26px; margin-left: auto; }
.col-head .btn-icon + .btn-icon { margin-left: 0; }
.col-sub { font-size: 11.5px; color: var(--hq-muted); padding: 0 12px 6px; margin-top: -3px; }
.col-list { padding: 2px 8px 8px; overflow-y: auto; display: flex; flex-direction: column; gap: 7px; min-height: 40px; }
.col-empty { border: 1.5px dashed var(--hq-border-strong); border-radius: var(--radius); padding: 14px 10px; text-align: center; color: var(--hq-muted); font-size: 12.5px; }
.col.is-collapsed { width: 46px; cursor: default; }
.col.is-collapsed .col-head { flex-direction: column; padding: 10px 0; gap: 10px; }
.col.is-collapsed .col-head .btn-icon { margin: 0; }
.col.is-collapsed .col-name { writing-mode: vertical-rl; transform: rotate(180deg); }
.col-add { margin: 0 8px 6px; display: flex; align-items: center; gap: 7px; height: 32px; padding: 0 9px; border-radius: var(--radius-sm); border: 0; background: none; color: var(--hq-text-2); font-weight: 550; font-size: 13px; }
.col-add:hover { background: var(--hq-sunken); color: var(--hq-text); }
.col.col-dock .col-add:hover, .col .col-add:hover { background: color-mix(in srgb, var(--hq-text) 7%, transparent); }
.composer { margin: 0 8px 8px; display: grid; gap: 6px; }
.composer textarea { min-height: 54px; resize: none; background: var(--work-card); border: 1px solid var(--hq-accent-line); box-shadow: var(--hq-shadow-sm); }
.composer-row { display: flex; gap: 6px; align-items: center; }
.composer-row small { margin-left: auto; color: var(--hq-muted); font-size: 11.5px; }

.card { position: relative; background: var(--work-card); border-radius: var(--radius); padding: 9px 10px 8px 13px; box-shadow: var(--hq-shadow-sm); border: 1px solid var(--hq-border); cursor: grab; user-select: none; touch-action: none; }
.card::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px; border-radius: 0 3px 3px 0; background: var(--why, transparent); }
.card.why-need { --why: var(--work-need); }
.card.why-want { --why: var(--work-want); }
.card.why-exploring { --why: var(--work-exploring); }
.card:hover { border-color: var(--hq-border-strong); }
.card:focus-visible { outline: 2px solid var(--hq-focus); outline-offset: 1px; }
.card.is-selected { border-color: var(--hq-accent); box-shadow: 0 0 0 1px var(--hq-accent), var(--hq-shadow-sm); }
.card.is-pending { opacity: .78; }
.card.is-closed .card-title { color: var(--hq-text-2); }
.card-top { display: flex; gap: 7px; align-items: flex-start; }
.card-top .kind { color: var(--hq-muted); margin-top: 2px; }
.card-title { font-size: 13.5px; font-weight: 550; line-height: 1.35; flex: 1; min-width: 0; overflow-wrap: anywhere; }
.card-menu { border: 0; background: none; color: var(--hq-muted); width: 24px; height: 22px; border-radius: 6px; margin: -2px -4px 0 0; display: grid; place-items: center; opacity: 0; }
.card:hover .card-menu, .card:focus-within .card-menu, .card-menu:focus-visible { opacity: 1; }
.card-menu:hover { background: var(--hq-sunken); color: var(--hq-text); }
.chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
.chip { display: inline-flex; align-items: center; gap: 4px; height: 21px; padding: 0 7px; border-radius: 999px; font-size: 11.5px; font-weight: 550; background: var(--hq-sunken); color: var(--hq-text-2); white-space: nowrap; }
.chip svg.ic { width: 12px; height: 12px; }
.pill-need { background: var(--work-need-bg); color: var(--work-need); }
.pill-want { background: var(--work-want-bg); color: var(--work-want); }
.pill-exploring { background: var(--work-exploring-bg); color: var(--work-exploring); }
.chip-date.dk-target { color: var(--work-dk-target); }
.chip-date.dk-deadline { color: var(--work-dk-deadline); }
.chip-date.dk-start { color: var(--work-dk-start); }
.chip-date.dk-event { color: var(--work-dk-event); }
.chip-date.is-coarse { background: transparent; border: 1px dashed currentColor; }
.chip-date.ds-overdue { background: var(--hq-danger-soft); color: var(--hq-danger); }
.chip-status { background: transparent; border: 1px solid var(--hq-border); color: var(--hq-text-2); }
.chip-prio { color: var(--hq-danger); background: transparent; border: 1px solid color-mix(in srgb, var(--hq-danger) 40%, transparent); }
.chip-area { background: transparent; color: var(--hq-muted); padding: 0 2px; }
.badges { display: flex; gap: 10px; margin-top: 7px; color: var(--hq-muted); font-size: 11.5px; align-items: center; }
.badges span { display: inline-flex; align-items: center; gap: 3px; }
.badges svg.ic { width: 13px; height: 13px; }
.badge-link { color: var(--hq-accent); }
.saving { position: absolute; right: 8px; bottom: 7px; font-size: 11px; font-weight: 600; color: var(--hq-accent); background: var(--hq-accent-soft); padding: 1px 6px; border-radius: 999px; }
.saving.is-unconfirmed { color: var(--hq-warning); background: var(--hq-warning-soft); }

.placeholder { border: 2px dashed var(--hq-accent-line); background: var(--hq-accent-soft); border-radius: var(--radius); flex: none; }
.drag-hidden { display: none !important; }
.ghost { position: fixed; z-index: 1000; pointer-events: none; transform: rotate(2.5deg); box-shadow: var(--hq-shadow-lg); cursor: grabbing; opacity: .97; }
.ghost-badge { position: absolute; left: 10px; top: -12px; background: var(--hq-text); color: var(--hq-base); font-size: 11.5px; font-weight: 650; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
body.dragging, body.dragging * { cursor: grabbing !important; }

.status-tabs { display: none; gap: 6px; padding: 0 14px 10px; overflow-x: auto; }
.status-tab { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--hq-border); background: var(--hq-raised); font-size: 12.5px; font-weight: 550; white-space: nowrap; color: var(--hq-text-2); }
.status-tab[aria-selected="true"] { border-color: var(--hq-accent); color: var(--hq-text); background: var(--hq-accent-soft); }
.status-tab.drop-active { box-shadow: 0 0 0 3px var(--hq-accent-soft); border-color: var(--hq-accent); }
.status-tab .n { color: var(--hq-muted); font-size: 11.5px; }

.proposal { margin: 0 18px 12px; padding: 10px 12px; border: 1px dashed var(--hq-border-strong); border-radius: var(--radius); font-size: 12.5px; color: var(--hq-text-2); display: flex; gap: 10px; align-items: flex-start; background: var(--hq-raised-2); }
.proposal svg { color: var(--hq-warning); margin-top: 1px; }
.proposal.is-info { border-style: solid; }
.proposal.is-info svg { color: var(--hq-accent); }

/* ---------------------------------------------------------------- overlays */

.toast .btn { margin-left: auto; background: transparent; color: inherit; border-color: color-mix(in srgb, var(--hq-base) 35%, transparent); height: 28px; }
.toast.is-error { background: var(--hq-danger); color: #fff; }

/* ---------------------------------------------------------------- other views */
.page { padding: 18px 22px 40px; max-width: 1180px; }
.page h2 { margin: 0 0 4px; font-size: 20px; letter-spacing: -.01em; }
.page .lede { margin: 0 0 18px; color: var(--hq-text-2); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; align-items: start; }
.panel { background: var(--hq-raised); border: 1px solid var(--hq-border); border-radius: var(--radius-lg); padding: 14px 16px; }
.panel h3 { margin: 0 0 10px; font-size: 13px; display: flex; align-items: center; gap: 8px; }
.panel h3 .n { color: var(--hq-muted); font-weight: 500; }
.rowlink { display: flex; align-items: center; gap: 10px; padding: 7px 6px; border-radius: 7px; border: 0; background: none; width: 100%; text-align: left; font-size: 13.5px; }

.stat-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
.stat { display: inline-flex; gap: 6px; align-items: center; height: 30px; padding: 0 11px; border-radius: 999px; border: 1px solid var(--hq-border); background: var(--hq-raised); font-size: 12.5px; }

.cal-h { background: var(--hq-raised-2); font-size: 11.5px; font-weight: 650; color: var(--hq-muted); padding: 6px 8px; text-transform: uppercase; letter-spacing: .05em; }

.cal-chip.dk-target { border-left-color: var(--work-dk-target); }

.band { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }

.tl-lane { border-top: 1px solid var(--hq-border); }

.tl-row { position: relative; height: 26px; }
.tl-row .lab { position: absolute; font-size: 11.5px; top: 5px; white-space: nowrap; color: var(--hq-text); background: var(--hq-raised); border-radius: 4px; }
.tl-mark { position: absolute; top: 7px; width: 10px; height: 10px; border-radius: 50%; margin-left: -5px; background: var(--work-dk-target); }

.tl-bar { position: absolute; top: 8px; height: 8px; border-radius: 4px; background: color-mix(in srgb, var(--work-dk-start) 55%, transparent); }
.tl-today { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--hq-accent); }
.review-card { display: grid; gap: 8px; padding: 12px; border: 1px solid var(--hq-border); border-radius: var(--radius); background: var(--hq-raised); }

/* ---------------------------------------------------------------- mockup instrumentation */
.mock { position: fixed; right: 14px; bottom: 14px; z-index: 70; width: 300px; background: var(--hq-raised); border: 1.5px dashed var(--hq-border-strong); border-radius: var(--radius); box-shadow: var(--hq-shadow); font-size: 12px; }

.mock-body { padding: 0 10px 10px; display: grid; gap: 8px; }
.mock-log { max-height: 150px; overflow: auto; font: 11px/1.45 var(--mono); background: var(--hq-sunken); border-radius: 6px; padding: 6px 7px; color: var(--hq-text-2); }
.mock-log div { white-space: pre-wrap; word-break: break-all; }
.mock-log .ok { color: var(--hq-success); }
.mock-log .err { color: var(--hq-danger); }
.mock-row { display: flex; gap: 6px; flex-wrap: wrap; }
.mock-note { color: var(--hq-muted); }

/* ---------------------------------------------------------------- narrow window */
@media (max-width: 760px) {
  .hq { grid-template-columns: 52px minmax(0, 1fr); }
  .work-nav { display: none; }
  .rail-item { width: 44px; font-size: 9.5px; }
  .topbar { padding: 8px 10px; gap: 8px; flex-wrap: wrap; }
  .ctx-note { display: none; }
  .search { width: auto; flex: 1; min-width: 120px; order: 5; }
  .view-select { display: block; }
  .board-head { padding: 12px 14px 8px; }
  .board-hint { display: none; }
  .status-tabs { display: flex; }
  .board { padding: 0 14px 90px; }
  .board .col, .board .add-list { display: none; }
  .board .col.is-mobile-current { display: flex; width: 100%; max-height: none; }
  .board .col.is-mobile-current.is-collapsed { width: 100%; }
  .board .col.is-mobile-current.is-collapsed .col-name { writing-mode: horizontal-tb; transform: none; }
  /* Date groups and proposed lists have no status tabs: stack them. */
  .board:not([data-board-kind="status"]) { flex-direction: column; overflow-x: visible; }
  .board:not([data-board-kind="status"]) .col { display: flex; width: 100%; max-height: none; flex: none; }
  .board:not([data-board-kind="status"]) .add-list { display: flex; width: 100%; }
  .detail { width: 100vw; }
  .mock { width: calc(100vw - 80px); right: 8px; }
  .mock:not([open]) { width: auto; }
  .cal-wrap { grid-template-columns: 1fr; }
  .fields { grid-template-columns: 84px 1fr; }
}
@media (prefers-reduced-motion: no-preference) {
  .card, .status-tab, .col { transition: border-color .12s, box-shadow .12s; }
  .toast { animation: toast-in .18s ease-out; }
  @keyframes toast-in { from { transform: translateY(8px); opacity: 0; } }
}

<script>

/* =================================================================== fictional fixture */

const base = { kind: 'idea', why: null, horizon: null, priority: null, area: null, notes: '', steps: [], refs: [], links: [], dates: [], archived: false, rev: 1, updated: '2026-10-18' };

      { kind: 'run', domain: 'Jones', objectKind: 'Request', title: 'Build home page v3 candidate', project: 'Pottery club site', observed: 'Running', checked: '6 min ago', state: 'observed' },

  { id: 'it-words', title: 'Write 300 words a day', kind: 'goal', status: 'active', why: 'want', horizon: 'now', area: 'Writing', updated: '2026-09-18', steps: [step('Pick a morning slot', true), step('Keep a word log')], dates: [d('target', 'month', '2026-10', { note: 'Finish draft one' })] },
  { id: 'it-hinge', title: 'Fix the shed door hinge', kind: 'chore', status: 'on_hold', horizon: 'someday', area: 'Home', notes: 'Waiting for the replacement part.', dates: [d('deadline', 'day', '2026-11-05')] },
  { id: 'it-market', title: 'Book the hall for the winter market', kind: 'project', status: 'done', why: 'need', area: 'Garden club', updated: '2026-10-12' },
  { id: 'it-card', title: 'Renew library card', kind: 'chore', status: 'done', updated: '2026-10-09' },
  { id: 'it-pod', title: 'Record a podcast pilot', kind: 'idea', status: 'dropped', why: 'exploring', updated: '2026-09-30' },
  { id: 'it-fair', title: 'Summer fair stall', kind: 'project', status: 'done', archived: true, updated: '2026-08-20' },
];
const counters = {};
FIXTURE.forEach((raw) => { counters[raw.status] = (counters[raw.status] || 0) + 1; raw.pos = counters[raw.status] * 1024; });

/* Proposed extension: one custom board with owner-editable lists. Placement is
   separate from status, horizon and dates. Requires a Planner schema change. */
const PROPOSED_LISTS = [
  { id: 'l-today', name: 'Today' }, { id: 'l-week', name: 'This Week' }, { id: 'l-later', name: 'Later' },
];
const PLACEMENTS = { 'it-lamp': ['l-today', 1], 'it-glaze': ['l-today', 2], 'it-news': ['l-week', 1], 'it-site': ['l-week', 2], 'it-paper': ['l-week', 3], 'it-seeds': ['l-later', 1], 'it-talk': ['l-later', 2] };

/* =================================================================== fixture adapter
   Mirrors Manual Planner semantics: revision guard (409 revision_conflict),
   server-owned order renumbered on move, anchors resolved against the full
   stored column (409 order_conflict when missing), request ids, and no
   execution capability. */
const server = {
  items: new Map(FIXTURE.map((raw) => [raw.id, structuredClone({ ...base, ...raw })])),
  placements: new Map(Object.entries(PLACEMENTS).map(([id, [list, n]]) => [id, { list, pos: n * 1024 }])),
  version: 41,
  reachable: true,
};
let EXECUTION_CALLS = 0;                // asserted to stay 0; nothing increments it
const LATENCY = 420;
const logEl = () => document.getElementById('mock-log');
function logCall(text, cls = '') {
  const row = document.createElement('div');
  row.className = cls;
  row.textContent = text;
  logEl().prepend(row);
}
class PlannerError extends Error {
  constructor(code, message, extra = {}) { super(message); this.code = code; Object.assign(this, extra); }
}
const rid = () => 'req-' + Math.random().toString(36).slice(2, 8);
const later = (ms) => new Promise((r) => setTimeout(r, ms));
function columnIds(status, except) {
  return [...server.items.values()].filter((it) => it.status === status && it.id !== except).sort((a, b) => a.pos - b.pos).map((it) => it.id);
}
const planner = {
  async call(name, args, apply) {
    const req = rid();
    logCall(`→ planner.${name}(${args}) ${req}`);
    await later(LATENCY);
    if (!server.reachable) { logCall(`← ${req} no response — unconfirmed`, 'err'); throw new PlannerError('network', 'The Planner service could not be reached.'); }
    try {
      const out = apply();
      server.version += 1;
      logCall(`← ${req} 200 · state_version ${server.version}`, 'ok');
      return out;
    } catch (err) {
      logCall(`← ${req} ${err.code === 'revision_conflict' || err.code === 'order_conflict' ? 409 : 400} ${err.code}`, 'err');
      throw err;
    }
  },
  guard(id, rev) {
    const it = server.items.get(id);
    if (!it) throw new PlannerError('not_found', 'That item does not exist.');
    if (it.rev !== rev) throw new PlannerError('revision_conflict', 'This item changed since you loaded it.', { current: structuredClone(it) });
    return it;
  },
  snapshot() { return { items: [...server.items.values()].map((it) => structuredClone(it)), version: server.version }; },
  createItem(fields) {
    return this.call('createItem', JSON.stringify({ title: fields.title, status: fields.status }), () => {
      const id = 'it-' + Math.random().toString(36).slice(2, 8);
      const top = columnIds(fields.status).map((x) => server.items.get(x).pos);
      const item = structuredClone({ ...base, ...fields, id, pos: (top.length ? Math.min(...top) : 2048) - 1024, rev: 1, updated: TODAY });
      server.items.set(id, item);
      return structuredClone(item);
    });
  },
  patchItem(id, rev, patch) {
    return this.call('patchItem', `${id}, rev ${rev}, {${Object.keys(patch).join(', ')}}`, () => {
      const it = this.guard(id, rev);
      Object.assign(it, structuredClone(patch));
      it.rev += 1; it.updated = TODAY;
      return structuredClone(it);
    });
  },
  moveItem(id, rev, status, anchors) {
    const a = anchors.after_id ? `after ${anchors.after_id}` : anchors.before_id ? `before ${anchors.before_id}` : anchors.place;
    return this.call('moveItem', `${id}, rev ${rev}, ${status}, ${a}`, () => {
      const it = this.guard(id, rev);
      const ids = columnIds(status, id);
      const anchor = anchors.after_id || anchors.before_id;
      let index;
      if (anchor) {
        if (!ids.includes(anchor)) throw new PlannerError('order_conflict', 'The board changed since it was loaded.');
        index = ids.indexOf(anchor) + (anchors.after_id ? 1 : 0);
      } else index = anchors.place === 'bottom' ? ids.length : 0;
      ids.splice(index, 0, id);
      ids.forEach((x, i) => { server.items.get(x).pos = (i + 1) * 1024; });
      it.status = status; it.rev += 1; it.updated = TODAY;
      return structuredClone(it);
    });
  },
  setArchived(id, rev, archived) {
    return this.call(archived ? 'archive' : 'restore', `${id}, rev ${rev}`, () => {
      const it = this.guard(id, rev);
      it.archived = archived; it.rev += 1;
      return structuredClone(it);
    });
  },
  /* Proposed (Planner schema v2): place an item on a custom list. */
  placeOnList(id, list, anchors) {
    const a = anchors.after_id ? `after ${anchors.after_id}` : anchors.before_id ? `before ${anchors.before_id}` : anchors.place;
    return this.call('placeOnList [proposed v2]', `${id}, ${list}, ${a}`, () => {
      const ids = [...server.placements.entries()].filter(([x, p]) => p.list === list && x !== id).sort((p, q) => p[1].pos - q[1].pos).map(([x]) => x);
      const anchor = anchors.after_id || anchors.before_id;
      let index = anchor ? ids.indexOf(anchor) + (anchors.after_id ? 1 : 0) : (anchors.place === 'bottom' ? ids.length : 0);
      if (anchor && !ids.includes(anchor)) throw new PlannerError('order_conflict', 'The list changed since it was loaded.');
      ids.splice(index, 0, id);
      ids.forEach((x, i) => { const p = server.placements.get(x) || { list }; p.list = list; p.pos = (i + 1) * 1024; server.placements.set(x, p); });
      return { id, list };
    });
  },
};

/* =================================================================== client state */
const state = {
  items: [], byId: new Map(), placements: new Map(),
  view: 'board', boardMode: 'status', selected: null, q: '',
  collapsed: new Set(['dropped']), mobileCol: 'inbox', composer: null,
  pending: new Map(),       // id -> 'saving' | 'unconfirmed'
  connection: 'online', loadedAt: '10:42 AM', drafts: [],
  conflict: null, focusKey: null, dirty: new Map(),
};
function load() {
  const snap = planner.snapshot();
  state.items = snap.items;
  state.byId = new Map(snap.items.map((it) => [it.id, it]));
  state.placements = new Map([...server.placements].map(([k, v]) => [k, { ...v }]));
}
function upsert(item) { state.byId.set(item.id, item); state.items = [...state.byId.values()]; }
const get = (id) => state.byId.get(id);
const live = () => state.items.filter((it) => !it.archived);
const isOpen = (it) => !CLOSED.has(it.status);
function matches(it) {
  if (!state.q) return true;
  const hay = [it.title, it.notes, it.area || '', ...it.steps.map((s) => s.text)].join('\n').toLowerCase();
  return hay.includes(state.q.toLowerCase());
}
const byPos = (a, b) => a.pos - b.pos;
const column = (status) => live().filter((it) => it.status === status && matches(it)).sort(byPos);
const columnAll = (status) => state.items.filter((it) => it.status === status).sort(byPos);

/* ------------------------------------------------------------------- ordering (ported semantics) */
function anchorsForDrop(visibleIds, index) {
  const i = Math.max(0, Math.min(index, visibleIds.length));
  if (i > 0) return { after_id: visibleIds[i - 1] };
  if (visibleIds.length) return { before_id: visibleIds[0] };
  return { place: 'top' };
}
function anchorsToRestore(allIds, id) {
  const i = allIds.indexOf(id);
  if (i < 0) return { place: 'top' };
  if (i > 0) return { after_id: allIds[i - 1] };
  if (allIds.length > 1) return { before_id: allIds[1] };
  return { place: 'top' };
}
function stepAnchors(visibleIds, id, delta) {
  const i = visibleIds.indexOf(id);
  const target = i + delta;
  if (i < 0 || target < 0 || target >= visibleIds.length) return null;
  return anchorsForDrop(visibleIds.filter((x) => x !== id), target);
}
function projectMove(id, status, anchors) {
  const ids = columnAll(status).filter((it) => it.id !== id).map((it) => it.id);
  const anchor = anchors.after_id || anchors.before_id;
  let index = anchor ? ids.indexOf(anchor) + (anchors.after_id ? 1 : 0) : (anchors.place === 'bottom' ? ids.length : 0);
  if (anchor && ids.indexOf(anchor) < 0) return null;
  ids.splice(index, 0, id);
  const before = new Map();
  ids.forEach((x, i) => { const it = get(x); before.set(x, { status: it.status, pos: it.pos }); upsert({ ...it, status, pos: (i + 1) * 1024 }); });
  return () => before.forEach((v, x) => { const it = get(x); if (it) upsert({ ...it, ...v }); });
}

/* ------------------------------------------------------------------- undo (in Work service, survives domain switches) */
const undoStack = [];
function remember(label, run, message) {
  const entry = { label, run };
  undoStack.push(entry);
  if (undoStack.length > 40) undoStack.shift();
  // An entry runs at most once, whether from its toast or from Ctrl/⌘+Z.
  entry.toastEl = toast(message, { action: { label: 'Undo', run: () => { const i = undoStack.indexOf(entry); if (i < 0) return; undoStack.splice(i, 1); entry.run(); } } });
}
function undoLast() {
  const entry = undoStack.pop();
  if (!entry) { toast('Nothing to undo.'); return; }
  entry.toastEl?.remove();
  entry.run();
}

/* ------------------------------------------------------------------- actions */
function failure(err, what) {
  if (err.code === 'network') toast(`${what}: not confirmed yet`, { error: true, detail: 'No response from the Planner service. Marked unconfirmed; it will be re-sent with the same request id when the service answers.' });
  else if (err.code === 'offline') toast(`${what}: not sent`, { error: true, detail: 'The Planner service is unreachable, so changes are paused.' });
  else if (err.code === 'revision_conflict') toast(`${what}: changed elsewhere`, { error: true, detail: 'The latest version is now shown. Please try again.' });
  else if (err.code === 'order_conflict') toast(`${what}: the board changed`, { error: true, detail: 'The latest order has been loaded. Please try again.' });
  else toast(`${what}: not saved`, { error: true, detail: err.message });
}
function ensureOnline() {
  if (state.connection === 'offline') throw new PlannerError('offline', 'Unreachable');
}

async function moveItem(item, status, anchors, { undo = true, label = null } = {}) {
  const baseItem = get(item.id);
  const oldStatus = baseItem.status;
  const restore = anchorsToRestore(columnAll(oldStatus).map((it) => it.id), baseItem.id);
  const what = label || (status === oldStatus ? 'Reorder' : `Move to ${ST[status].label}`);
  try { ensureOnline(); } catch (err) { failure(err, what); return; }
  const rollback = projectMove(baseItem.id, status, anchors);
  state.pending.set(baseItem.id, 'saving');
  render();
  try {
    const saved = await planner.moveItem(baseItem.id, baseItem.rev, status, anchors);
    state.pending.delete(baseItem.id);
    upsert({ ...get(saved.id), ...saved });
    load();
    const msg = status === oldStatus ? `Reordered “${baseItem.title}”.` : `Moved “${baseItem.title}” to ${ST[status].label}.`;
    announce(msg);
    if (undo) remember(what, () => moveItem(get(baseItem.id), oldStatus, restore, { undo: false, label: 'Undo move' }), msg);
  } catch (err) {
    if (err.code === 'network') { state.pending.set(baseItem.id, 'unconfirmed'); setConnection('offline'); }
    else { state.pending.delete(baseItem.id); rollback && rollback(); load(); }
    failure(err, what);
  }
  render();
}

/* Field patches register a compare-and-swap undo: undo only applies when the
   field still holds the value this change wrote (recommendation; the current
   Planner client sends the inverse unconditionally at the latest revision). */
async function patchItem(item, patch, { label = 'Change', undo = true, quiet = false } = {}) {
  const baseItem = get(item.id);
  const inverse = Object.fromEntries(Object.keys(patch).map((k) => [k, structuredClone(baseItem[k])]));
  ensureOnline();
  state.pending.set(baseItem.id, 'saving');
  render({ keepDetail: true });
  try {
    const saved = await planner.patchItem(baseItem.id, baseItem.rev, patch);
    state.pending.delete(baseItem.id);
    upsert(saved);
    if (undo) {
      remember(label, async () => {
        const now = get(baseItem.id);
        const unchanged = Object.keys(patch).every((k) => JSON.stringify(now[k]) === JSON.stringify(saved[k]));
        if (!unchanged) { toast('Not undone', { error: true, detail: `${label} was changed again since; the newer value was kept.` }); return; }
        try { await patchItem(now, inverse, { label: 'Undo', undo: false, quiet: true }); toast('Undone.'); } catch (err) { failure(err, 'Undo'); }
      }, `${label} saved.`);
    } else if (!quiet) toast(`${label} saved.`);
    render({ keepDetail: true });
    return saved;
  } catch (err) {
    state.pending.delete(baseItem.id);
    if (err.code === 'revision_conflict' && err.current) upsert(err.current);
    render({ keepDetail: true });
    throw err;
  }
}

async function createItem(fields) {
  if (state.connection === 'offline') {
    state.drafts.push({ ...fields, localId: rid() });
    toast(`Kept “${fields.title}” as a device draft.`, { detail: 'Not in the planning store until you send it.' });
    render();
    return null;
  }
  const item = await planner.createItem(fields);
  load();
  announce(`Added “${item.title}” to ${ST[item.status].label}.`);
  remember('New item', async () => {
    try { await setArchived(get(item.id), true, { undo: false, quietMessage: `Removed new item “${item.title}” (archived, restorable).` }); } catch (err) { failure(err, 'Undo'); }
  }, `Added “${item.title}” to ${ST[item.status].label}.`);
  render();
  return item;
}

async function setArchived(item, archived, { undo = true, quietMessage = null } = {}) {
  const baseItem = get(item.id);
  try { ensureOnline(); } catch (err) { failure(err, archived ? 'Archive' : 'Restore'); return; }
  try {
    const saved = await planner.setArchived(baseItem.id, baseItem.rev, archived);
    upsert(saved);
    const msg = quietMessage || (archived ? `Archived “${baseItem.title}”.` : `Restored “${baseItem.title}”.`);
    if (undo) remember(archived ? 'Archive' : 'Restore', () => setArchived(get(baseItem.id), !archived, { undo: false }), msg);
    else toast(msg);
    if (archived && state.selected === baseItem.id) closeDetail();
  } catch (err) { failure(err, archived ? 'Archive' : 'Restore'); }
  render();
}

async function placeOnList(item, list, anchors, { undo = true } = {}) {
  const old = state.placements.get(item.id);
  const oldIds = [...state.placements.entries()].filter(([, p]) => old && p.list === old.list).sort((p, q) => p[1].pos - q[1].pos).map(([x]) => x);
  const restore = old ? anchorsToRestore(oldIds, item.id) : null;
  try { ensureOnline(); } catch (err) { failure(err, 'Move'); return; }
  state.pending.set(item.id, 'saving');
  // projection
  const ids = [...state.placements.entries()].filter(([x, p]) => p.list === list && x !== item.id).sort((p, q) => p[1].pos - q[1].pos).map(([x]) => x);
  const anchor = anchors.after_id || anchors.before_id;
  ids.splice(anchor ? ids.indexOf(anchor) + (anchors.after_id ? 1 : 0) : 0, 0, item.id);
  ids.forEach((x, i) => state.placements.set(x, { list, pos: (i + 1) * 1024 - 1 }));
  render();
  try {
    await planner.placeOnList(item.id, list, anchors);
    state.pending.delete(item.id);
    load();
    const name = PROPOSED_LISTS.find((l) => l.id === list).name;
    const msg = old && old.list === list ? `Reordered “${item.title}” in ${name}.` : `Placed “${item.title}” in ${name}. Status, horizon and dates unchanged.`;
    announce(msg);
    if (undo && old) remember('List move', () => placeOnList(get(item.id), old.list, restore, { undo: false }), msg);
  } catch (err) { state.pending.delete(item.id); load(); failure(err, 'Move'); }
  render();
}

/* =================================================================== formatting */
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const toDate = (iso) => new Date(iso + 'T00:00:00Z');
const dayNum = (iso) => Math.round(toDate(iso).getTime() / 864e5);
const isoOf = (dt) => dt.toISOString().slice(0, 10);
function isoWeekStart(value) {
  const [y, w] = value.split('-W').map(Number);
  const jan4 = new Date(Date.UTC(y, 0, 4));
  const mon = new Date(jan4); mon.setUTCDate(jan4.getUTCDate() - ((jan4.getUTCDay() + 6) % 7) + (w - 1) * 7);
  return mon;
}
function bounds(e) {
  if (e.precision === 'day') return [e.value, e.value];
  if (e.precision === 'week') { const s = isoWeekStart(e.value); const t = new Date(s); t.setUTCDate(s.getUTCDate() + 6); return [isoOf(s), isoOf(t)]; }
  if (e.precision === 'month') { const [y, m] = e.value.split('-').map(Number); return [isoOf(new Date(Date.UTC(y, m - 1, 1))), isoOf(new Date(Date.UTC(y, m, 0)))]; }
  if (e.precision === 'quarter') { const [y, q] = e.value.split('-Q').map(Number); return [isoOf(new Date(Date.UTC(y, 3 * q - 3, 1))), isoOf(new Date(Date.UTC(y, 3 * q, 0)))]; }
  const y = Number(e.value); return [`${y}-01-01`, `${y}-12-31`];
}
function fmtDay(iso) { const dt = toDate(iso); return `${DAYS[dt.getUTCDay()]} ${MONTHS[dt.getUTCMonth()]} ${dt.getUTCDate()}`; }
function fmtShort(e) {
  if (e.precision === 'day') { const n = dayNum(e.value) - dayNum(TODAY); if (n === 0) return 'Today'; if (n === 1) return 'Tomorrow'; return fmtDay(e.value).slice(4); }
  if (e.precision === 'week') return `Week of ${fmtDay(bounds(e)[0]).slice(4)}`;
  if (e.precision === 'month') { const [y, m] = e.value.split('-'); return `${MONTHS[m - 1]} ${y}`; }
  if (e.precision === 'quarter') { const [y, q] = e.value.split('-Q'); return `Q${q} ${y}`; }
  return e.value;
}
function fmtLong(e) {
  if (e.precision === 'day') return fmtDay(e.value) + (e.time ? ` · ${to12(e.time)} ${ZONE_ABBR}` : '');
  return fmtShort(e);
}
const to12 = (t) => { const [h, m] = t.split(':').map(Number); return `${(h % 12) || 12}:${String(m).padStart(2, '0')} ${h < 12 ? 'AM' : 'PM'}`; };
function relative(e) {
  if (e.precision !== 'day') { const [a, b] = bounds(e); return dayNum(TODAY) < dayNum(a) ? 'later period' : dayNum(TODAY) > dayNum(b) ? 'period passed' : 'this period'; }
  const n = dayNum(e.value) - dayNum(TODAY);
  if (n === 0) return 'today'; if (n > 0) return `in ${n} day${n === 1 ? '' : 's'}`; return `${-n} day${n === -1 ? '' : 's'} ago`;
}
function dateState(e, open) {
  const [a, b] = bounds(e);
  if (dayNum(b) < dayNum(TODAY)) return e.kind === 'deadline' && open ? 'overdue' : 'passed';
  if (dayNum(a) <= dayNum(TODAY)) return e.precision === 'day' ? 'today' : 'current';
  return 'upcoming';
}
function primaryDate(it) {
  const open = isOpen(it);
  const overdue = it.dates.find((e) => dateState(e, open) === 'overdue');
  if (overdue) return overdue;
  const ahead = it.dates.filter((e) => dayNum(bounds(e)[1]) >= dayNum(TODAY)).sort((x, y) => dayNum(bounds(x)[0]) - dayNum(bounds(y)[0]));
  return ahead[0] || it.dates[it.dates.length - 1] || null;
}

/* =================================================================== rendering helpers */
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ic = (name, extra = '') => `<svg class="ic" ${extra} aria-hidden="true"><use href="#i-${name}"/></svg>`;
function dateChip(e, it) {
  const s = dateState(e, isOpen(it));
  const prefix = s === 'overdue' ? '<strong>Overdue ·</strong> ' : (s === 'passed' && e.kind === 'target' ? 'Target passed · ' : '');
  return `<span class="chip chip-date dk-${e.kind} ds-${s} ${e.precision !== 'day' ? 'is-coarse' : ''}" title="${DATE_KIND[e.kind]} · ${esc(fmtLong(e))}">${ic(e.kind)}<span class="sr">${DATE_KIND[e.kind]}: </span>${prefix}${esc(fmtShort(e))}</span>`;
}
function cardHTML(it, { showStatus = false } = {}) {
  const pending = state.pending.get(it.id);
  const done = it.steps.filter((s) => s.done).length;
  const pd = primaryDate(it);
  const chips = [
    showStatus ? `<span class="chip chip-status"><span class="st-dot" style="--st:var(--work-st-${it.status})"></span>${ST[it.status].label}</span>` : '',
    it.why ? `<span class="chip pill-${it.why}">${WHY[it.why]}</span>` : '',
    it.horizon ? `<span class="chip" title="Horizon">${HORIZONS[it.horizon]}</span>` : '',
    pd ? dateChip(pd, it) : '',
    it.priority === 'high' ? `<span class="chip chip-prio">${ic('up')}High</span>` : '',
  ].join('');
  const badges = [
    it.notes ? `<span title="Has notes">${ic('notes')}<span class="sr">Has notes</span></span>` : '',
    it.steps.length ? `<span title="Next steps">${ic('check')}${done}/${it.steps.length}</span>` : '',
    it.refs.length ? `<span title="Links">${ic('link')}${it.refs.length}</span>` : '',
    it.links.length ? `<span class="badge-link" title="Linked across HQ (proposed)">${ic('run')}${it.links.length} linked</span>` : '',
    it.area ? `<span class="chip chip-area">${esc(it.area)}</span>` : '',
  ].join('');
  const label = `${it.title}. ${ST[it.status].label}${it.why ? ', ' + WHY[it.why] : ''}${it.horizon ? ', horizon ' + HORIZONS[it.horizon] : ''}${pd ? ', ' + DATE_KIND[pd.kind] + ' ' + fmtLong(pd) : ''}.`;
  return `<article class="card ${it.why ? 'why-' + it.why : ''} ${pending ? 'is-pending' : ''} ${CLOSED.has(it.status) ? 'is-closed' : ''} ${state.selected === it.id ? 'is-selected' : ''}" data-card data-id="${it.id}" tabindex="0" data-focus-key="card:${it.id}" aria-label="${esc(label)}" aria-roledescription="draggable card">
    <div class="card-top"><span class="kind">${ic(it.kind)}</span><span class="card-title">${esc(it.title)}</span>
      <button class="card-menu" data-menu="${it.id}" aria-label="Move or open “${esc(it.title)}”" tabindex="-1">${ic('more')}</button></div>
    ${chips ? `<div class="chips">${chips}</div>` : ''}
    ${badges ? `<div class="badges">${badges}</div>` : ''}
    ${pending ? `<span class="saving ${pending === 'unconfirmed' ? 'is-unconfirmed' : ''}">${pending === 'unconfirmed' ? 'Unconfirmed' : 'Saving…'}</span>` : ''}
  </article>`;
}

/* =================================================================== views */
function renderBoard() {
  const isLists = state.boardMode === 'lists';
  const isDates = state.boardMode === 'dates';
  const head = `<div class="board-head">
    <h2>${isLists ? 'Weekly plan' : isDates ? 'By date' : 'Status board'}</h2>
    <div class="seg" role="group" aria-label="Board">
      <button data-board="status" aria-pressed="${state.boardMode === 'status'}">Status board</button>
      <button data-board="dates" aria-pressed="${isDates}">By date</button>
      <button data-board="lists" aria-pressed="${isLists}">Weekly plan <span class="tag-proposed">Proposed</span></button>
    </div>
    <div class="board-hint">${isDates ? 'Open a card to change its date' : `Drag a card, or use its ${ic('more')} menu`}<button class="btn btn-ghost btn-sm" data-shortcuts>Keyboard <kbd>?</kbd></button></div>
  </div>`;
  if (isLists) return head + renderListsBoard();
  if (isDates) return head + renderDatesBoard();
  const tabs = `<div class="status-tabs" role="tablist" aria-label="Board column">${STATUSES.map((s) => `<button class="status-tab" role="tab" aria-selected="${state.mobileCol === s.id}" data-tab="${s.id}" data-drop-tab="${s.id}"><span class="st-dot" style="--st:var(--work-st-${s.id})"></span>${s.label}<span class="n">${column(s.id).length}</span></button>`).join('')}</div>`;
  const cols = STATUSES.map((s) => {
    const items = column(s.id);
    const collapsed = state.collapsed.has(s.id);
    const dock = s.id === 'inbox';
    const composerOpen = state.composer === s.id;
    const list = collapsed ? '' : `<div class="col-list" data-col-list="${s.id}">${items.map((it) => cardHTML(it)).join('') || `<div class="col-empty">${state.q ? 'No matches here' : s.hint}<br><small>Drop cards here</small></div>`}</div>`;
    const composer = collapsed ? '' : composerOpen
      ? `<div class="composer"><textarea class="textarea" id="composer-input" placeholder="Enter a title" aria-label="New item title in ${s.label}"></textarea>
          <div class="composer-row"><button class="btn btn-primary btn-sm" data-composer-save="${s.id}">Add card</button><button class="btn btn-ghost btn-icon btn-sm" data-composer-close aria-label="Close">${ic('close')}</button><small>Adds to the top · <kbd>Esc</kbd></small></div></div>`
      : `<button class="col-add" data-composer="${s.id}">${ic('plus')}${dock ? 'Capture to Inbox' : 'Add a card'}</button>`;
    return `<section class="col ${dock ? 'col-dock' : ''} ${collapsed ? 'is-collapsed' : ''} ${state.mobileCol === s.id ? 'is-mobile-current' : ''}" data-drop-col="${s.id}" aria-label="${s.label}, ${items.length} item${items.length === 1 ? '' : 's'}" style="--st:var(--work-st-${s.id})">
      <header class="col-head"><span class="col-name"><span class="st-dot"></span>${s.label}</span><span class="col-count">${items.length}</span>
        <button class="btn btn-ghost btn-icon" data-collapse="${s.id}" aria-expanded="${!collapsed}" aria-label="${collapsed ? 'Expand' : 'Collapse'} ${s.label}" title="${collapsed ? 'Expand' : 'Collapse'} (still accepts drops)">${ic(collapsed ? 'expand' : 'collapse')}</button></header>
      ${dock && !collapsed ? `<div class="col-sub">Status · ${s.hint.toLowerCase()}</div>` : ''}
      ${composer}${list}
    </section>`;
  }).join('');
  return head + tabs + `<div class="board" data-board-kind="status">${cols}</div>`;
}

function renderListsBoard() {
  const banner = `<div class="proposal" role="note">${ic('alert')}<div><strong>Proposed extension, not current Planner behavior.</strong> Owner-editable lists on a custom board need a Planner schema change (see adapter-boundary.md). Moving a card here changes only its list placement. Its <em>status</em>, <em>horizon</em> and <em>dates</em> stay as shown on the card. Nothing is renamed or migrated.</div></div>`;
  const cols = PROPOSED_LISTS.map((l) => {
    const ids = [...state.placements.entries()].filter(([x, p]) => p.list === l.id && get(x) && !get(x).archived).sort((p, q) => p[1].pos - q[1].pos).map(([x]) => x);
    const items = ids.map(get).filter(matches);
    return `<section class="col" data-drop-col="${l.id}" data-list="${l.id}" aria-label="${l.name}, ${items.length} items">
      <header class="col-head"><span class="col-name">${l.name}</span><span class="col-count">${items.length}</span>
        <button class="btn btn-ghost btn-icon" aria-label="List actions" title="Rename, reorder or archive list">${ic('more')}</button></header>
      <div class="col-list" data-col-list="${l.id}">${items.map((it) => cardHTML(it, { showStatus: true })).join('') || '<div class="col-empty">Drop cards here</div>'}</div>
      <button class="col-add">${ic('plus')}Add existing item</button>
    </section>`;
  }).join('');
  return banner + `<div class="board" data-board-kind="lists">${cols}<button class="add-list">${ic('plus')}Add another list</button></div>`;
}

/* Phase-1 default for Today / This week / Later: read-only groups derived from
   each item's own dates (ISO week, Monday start). Nothing here writes. */
const WEEK_END = '2026-10-25';
const DATE_GROUPS = [
  { id: 'today', name: 'Today', rule: 'A day date today, or an overdue deadline' },
  { id: 'week', name: 'This week', rule: 'A day or week date later this week (to Sun Oct 25)' },
  { id: 'later', name: 'Later', rule: 'A date after this week, or a month, quarter or year period' },
  { id: 'none', name: 'Undated', rule: 'No date ahead. Dates are never invented' },
];
function dateGroup(it) {
  const open = isOpen(it);
  if (it.dates.some((e) => (e.precision === 'day' && e.value === TODAY) || dateState(e, open) === 'overdue')) return 'today';
  const ahead = it.dates.filter((e) => dayNum(bounds(e)[1]) >= dayNum(TODAY));
  if (ahead.some((e) => (e.precision === 'day' || e.precision === 'week') && dayNum(bounds(e)[1]) <= dayNum(WEEK_END))) return 'week';
  return ahead.length ? 'later' : 'none';
}
function renderDatesBoard() {
  const banner = `<div class="proposal is-info" role="note">${ic('calendar')}<div><strong>Grouped from each card's own dates.</strong> This board is read-only, so dragging is off. To move a card to another group, change its date in the card. Status and horizon don't change here. Done and Dropped are hidden.</div></div>`;
  const items = live().filter((it) => isOpen(it) && matches(it)).sort((a, b) => ORDER.indexOf(a.status) - ORDER.indexOf(b.status) || a.pos - b.pos);
  const cols = DATE_GROUPS.map((g) => {
    const list = items.filter((it) => dateGroup(it) === g.id);
    return `<section class="col" data-drop-col="${g.id}" aria-label="${g.name}, ${list.length} item${list.length === 1 ? '' : 's'}">
      <header class="col-head"><span class="col-name">${g.name}</span><span class="col-count">${list.length}</span></header>
      <div class="col-sub">${g.rule}</div>
      <div class="col-list">${list.map((it) => cardHTML(it, { showStatus: true })).join('') || '<div class="col-empty">Nothing here</div>'}</div>
    </section>`;
  }).join('');
  return banner + `<div class="board" data-board-kind="dates">${cols}</div>`;
}

function renderGlance() {
  const items = live();
  const active = items.filter((it) => it.status === 'active');
  const overdue = items.filter((it) => isOpen(it) && it.dates.some((e) => dateState(e, true) === 'overdue'));
  const upcoming = [];
  items.filter(isOpen).forEach((it) => it.dates.forEach((e) => { const [a] = bounds(e); const n = dayNum(a) - dayNum(TODAY); if (e.precision === 'day' && n >= 0 && n <= 21) upcoming.push({ it, e, n }); }));
  upcoming.sort((x, y) => x.n - y.n);
  const inbox = column('inbox');
  const now = items.filter((it) => isOpen(it) && (it.status === 'active' || it.horizon === 'now'));
  const recent = [...items].sort((a, b) => (a.updated < b.updated ? 1 : -1)).slice(0, 5);
  const row = (it, meta) => `<button class="rowlink" data-open="${it.id}"><span class="st-dot" style="--st:var(--work-st-${it.status})" title="${ST[it.status].label}"></span>${esc(it.title)}<span class="meta">${meta}</span></button>`;
  return `<div class="page">
    <h2>Good morning</h2>
    <p class="lede">${active.length} active, ${overdue.length} overdue, ${upcoming.length} dates in the next 21 days, ${inbox.length} waiting in Inbox.</p>
    <div class="stat-row">${STATUSES.map((s) => `<button class="stat" data-goto-board="${s.id}"><span class="st-dot" style="--st:var(--work-st-${s.id})"></span>${s.label} <b>${items.filter((it) => it.status === s.id).length}</b></button>`).join('')}</div>
    <div class="grid2">
      <section class="panel"><h3>Now <span class="n">${now.length}</span></h3>${now.map((it) => row(it, esc(it.steps.find((s) => !s.done)?.text || ST[it.status].label))).join('')}</section>
      <section class="panel"><h3>Next 21 days <span class="n">${upcoming.length + overdue.length}</span></h3>
        ${overdue.map((it) => row(it, '<span style="color:var(--hq-danger);font-weight:600">Overdue</span>')).join('')}
        ${upcoming.map(({ it, e }) => row(it, `${DATE_KIND[e.kind]} · ${fmtShort(e)}`)).join('')}</section>
      <section class="panel"><h3>Inbox <span class="n">${inbox.length}</span></h3>${inbox.map((it) => row(it, 'Sort in Review')).join('')}</section>
      <section class="panel"><h3>Recently changed</h3>${recent.map((it) => row(it, fmtDay(it.updated).slice(4))).join('')}</section>
    </div></div>`;
}

function renderList() {
  const items = live().filter(matches).sort((a, b) => ORDER.indexOf(a.status) - ORDER.indexOf(b.status) || a.pos - b.pos);
  return `<div class="page"><h2>List</h2><p class="lede">Every live item. Status changes here use the same move call as the board, so undo restores the card's place.</p>
    <table class="list"><thead><tr><th>Title</th><th>Status</th><th>Horizon</th><th>Why</th><th>Next date</th><th>Area</th></tr></thead><tbody>
    ${items.map((it) => { const pd = primaryDate(it); return `<tr><td><button class="rowlink" style="padding:2px 0" data-open="${it.id}">${ic(it.kind)}${esc(it.title)}</button></td>
      <td><select class="select" data-list-status="${it.id}" aria-label="Status of ${esc(it.title)}">${STATUSES.map((s) => `<option value="${s.id}" ${s.id === it.status ? 'selected' : ''}>${s.label}</option>`).join('')}</select></td>
      <td><select class="select" data-list-horizon="${it.id}" aria-label="Horizon of ${esc(it.title)}"><option value="">—</option>${Object.entries(HORIZONS).map(([k, v]) => `<option value="${k}" ${k === it.horizon ? 'selected' : ''}>${v}</option>`).join('')}</select></td>
      <td>${it.why ? `<span class="chip pill-${it.why}">${WHY[it.why]}</span>` : '<span style="color:var(--hq-muted)">—</span>'}</td>
      <td>${pd ? dateChip(pd, it) : ''}</td><td>${esc(it.area || '')}</td></tr>`; }).join('')}
    </tbody></table></div>`;
}

function renderCalendar() {
  const first = toDate('2026-10-01');
  const start = new Date(first); start.setUTCDate(1 - first.getUTCDay());
  const entries = [];
  live().filter((it) => isOpen(it) && matches(it)).forEach((it) => it.dates.forEach((e) => entries.push({ it, e })));
  const dayChips = (iso) => entries.filter(({ e }) => e.precision === 'day' && e.value === iso).map(({ it, e }) =>
    `<button class="cal-chip dk-${e.kind} ${dateState(e, true) === 'overdue' ? 'overdue' : ''}" data-open="${it.id}" title="${DATE_KIND[e.kind]} · ${esc(it.title)}">${esc(it.title)}</button>`).join('');
  let cells = DAYS.map((x) => `<div class="cal-h">${x}</div>`).join('');
  for (let w = 0; w < 5; w += 1) {
    for (let i = 0; i < 7; i += 1) {
      const dt = new Date(start); dt.setUTCDate(start.getUTCDate() + w * 7 + i);
      const iso = isoOf(dt);
      cells += `<div class="cal-d ${dt.getUTCMonth() !== 9 ? 'out' : ''} ${iso === TODAY ? 'today' : ''}"><span class="n">${dt.getUTCDate()}</span>${dayChips(iso)}</div>`;
    }
    const weekStart = new Date(start); weekStart.setUTCDate(start.getUTCDate() + w * 7 + 1);
    const weekly = entries.filter(({ e }) => e.precision === 'week' && bounds(e)[0] === isoOf(weekStart));
    if (weekly.length) cells += `<div class="cal-week">${weekly.map(({ it, e }) => `Week · ${DATE_KIND[e.kind]}: ${esc(it.title)}`).join(' · ')}</div>`;
  }
  const period = entries.filter(({ e }) => ['month', 'quarter', 'year'].includes(e.precision) && bounds(e)[0] <= '2026-10-31' && bounds(e)[1] >= '2026-10-01');
  const outside = entries.filter(({ e }) => !(bounds(e)[0] <= '2026-10-31' && bounds(e)[1] >= '2026-10-01'));
  const unscheduled = live().filter((it) => isOpen(it) && !it.dates.length);
  return `<div class="page" style="max-width:1300px"><h2>October 2026</h2><p class="lede">Coarse dates stay periods: they sit in the period band and are never pinned to a day.</p>
    <div class="band"><span style="font-size:12px;color:var(--hq-muted);align-self:center">This month:</span>${period.map(({ it, e }) => `<span class="chip">${ic(e.kind)}${esc(it.title)} · ${fmtShort(e)}</span>`).join('') || '<span class="chip">None</span>'}</div>
    <div class="cal-wrap"><div class="cal">${cells}</div>
    <div class="grid2" style="grid-template-columns:1fr;align-content:start">
      <section class="panel"><h3>Unscheduled <span class="n">${unscheduled.length}</span></h3>${unscheduled.slice(0, 6).map((it) => `<button class="rowlink" data-open="${it.id}">${esc(it.title)}</button>`).join('')}<p style="font-size:12px;color:var(--hq-muted);margin:6px 0 0">Drag onto a day, then choose Target, Deadline, Start or Event.</p></section>
      <section class="panel"><h3>Outside this month</h3>${outside.map(({ it, e }) => `<button class="rowlink" data-open="${it.id}">${esc(it.title)}<span class="meta">${DATE_KIND[e.kind]} · ${fmtShort(e)}</span></button>`).join('')}</section>
    </div></div></div>`;
}

function renderTimeline() {
  const quarters = ['Q4 2026', 'Q1 2027', 'Q2 2027', 'Q3 2027', 'Q4 2027', 'Q1 2028', 'Q2 2028', 'Q3 2028'];
  const t0 = dayNum('2026-10-01'); const t1 = dayNum('2028-10-01');
  const pct = (iso) => Math.max(0, Math.min(100, ((dayNum(iso) - t0) / (t1 - t0)) * 100));
  const lanes = [...Object.entries(HORIZONS), ['', 'No horizon']];
  return `<div class="page" style="max-width:1300px"><h2>Timeline</h2><p class="lede">Horizon lanes across eight quarters. Drag a row to another lane to change its horizon; a bar is drawn only from a start to a later target or deadline.</p>
    <div class="tl"><div class="tl-head"><div>Horizon</div><div class="tl-q">${quarters.map((q) => `<div>${q}</div>`).join('')}</div></div>
    ${lanes.map(([k, label]) => { const rows = live().filter((it) => isOpen(it) && (it.horizon || '') === k && matches(it)); return `<div class="tl-lane"><div>${label}</div><div class="tl-rows"><span class="tl-today" style="left:${pct(TODAY)}%"></span>${rows.map((it) => {
      const start = it.dates.find((e) => e.kind === 'start');
      const end = it.dates.find((e) => e.kind !== 'start' && start && dayNum(bounds(e)[1]) > dayNum(start.value));
      const marks = it.dates.map((e) => e.precision === 'day' ? `<span class="tl-mark dk-${e.kind}" style="left:${pct(e.value)}%" title="${DATE_KIND[e.kind]} ${fmtLong(e)}"></span>` : `<span class="tl-band" style="left:${pct(bounds(e)[0])}%;width:${Math.max(.6, pct(bounds(e)[1]) - pct(bounds(e)[0]))}%" title="${DATE_KIND[e.kind]} ${fmtShort(e)}"></span>`).join('');
      const bar = start && end ? `<span class="tl-bar" style="left:${pct(start.value)}%;width:${pct(bounds(end)[1]) - pct(start.value)}%"></span>` : '';
      const labLeft = it.dates.length ? Math.min(78, Math.max(...it.dates.map((e) => pct(bounds(e)[1]))) + 1.2) : 1;
      return `<div class="tl-row">${bar}${marks}<button class="lab rowlink" data-open="${it.id}" style="left:${labLeft}%;width:auto;padding:0 4px;top:2px">${esc(it.title)}</button></div>`; }).join('') || '<div class="tl-row"></div>'}</div></div>`; }).join('')}
    </div></div>`;
}

function renderReview() {
  const items = live();
  const inbox = column('inbox');
  const overdue = items.filter((it) => isOpen(it) && it.dates.some((e) => dateState(e, true) === 'overdue'));
  const passed = items.filter((it) => isOpen(it) && it.dates.some((e) => e.kind === 'target' && dateState(e, true) === 'passed'));
  const quiet = items.filter((it) => it.status === 'active' && dayNum(TODAY) - dayNum(it.updated) >= 21);
  const mismatch = items.filter((it) => isOpen(it) && it.horizon === 'someday' && it.dates.some((e) => e.kind === 'deadline' && dayNum(bounds(e)[0]) - dayNum(TODAY) <= 45 && dayNum(bounds(e)[0]) >= dayNum(TODAY)));

  const card = (it, why, acts) => `<div class="review-card"><button class="rowlink" style="padding:0;font-weight:600" data-open="${it.id}">${esc(it.title)}</button><div class="why">${why}</div><div class="acts">${acts}</div></div>`;
  const sec = (title, list) => list ? `<section class="panel"><h3>${title}</h3><div style="display:grid;gap:8px">${list}</div></section>` : '';
  return `<div class="page"><h2>Review</h2><p class="lede">Gentle prompts. Nothing changes until you choose an action.</p><div class="grid2">
    ${sec(`Sort Inbox <span class="n">${inbox.length}</span>`, inbox.map((it) => card(it, 'Captured, not yet sorted.', `${Object.entries(WHY).map(([k, v]) => `<button class="btn btn-sm" data-review-why="${it.id}:${k}">${v}</button>`).join('')}<button class="btn btn-sm" data-menu-btn="${it.id}">Move to…</button>`)).join(''))}
    ${sec(`Overdue deadlines <span class="n">${overdue.length}</span>`, overdue.map((it) => card(it, 'Deadline ' + fmtLong(it.dates.find((e) => e.kind === 'deadline')) + ' has passed.', `<button class="btn btn-sm">Reschedule…</button><button class="btn btn-sm" data-review-done="${it.id}">Mark done</button>`)).join(''))}
    ${sec('Passed targets', passed.map((it) => card(it, 'Target passed. Targets stay neutral; set a new one if it still matters.', '<button class="btn btn-sm">New target…</button>')).join(''))}
    ${sec('Active but quiet', quiet.map((it) => card(it, `No changes for ${dayNum(TODAY) - dayNum(it.updated)} days (threshold 21).`, `<button class="btn btn-sm">Still active</button><button class="btn btn-sm" data-menu-btn="${it.id}">Move to…</button>`)).join(''))}
    ${sec('Horizon and date disagree', mismatch.map((it) => card(it, 'Horizon is Someday, but it has a deadline within six weeks.', '<button class="btn btn-sm">Set horizon…</button>')).join(''))}
    ${sec('No “why” yet', noWhy.map((it) => card(it, 'Say whether this is a need, a want or exploration.', Object.entries(WHY).map(([k, v]) => `<button class="btn btn-sm" data-review-why="${it.id}:${k}">${v}</button>`).join(''))).join(''))}

}

function openDetail(id) { state.selected = id; state.conflict = null; state.dirty.clear(); render(); document.querySelector('#detail .detail-title')?.focus(); }
function closeDetail() {
  const id = state.selected;
  flushNotes();
  state.selected = null; state.conflict = null; state.dirty.clear();
  render();
  if (id) document.querySelector(`[data-focus-key="card:${id}"]`)?.focus();
}

let notesTimer = null;
function flushNotes() {
  if (!notesTimer) return;
  clearTimeout(notesTimer); notesTimer = null;
  saveNotes();
}
async function saveNotes() {
  const it = get(state.selected);
  if (!it || !state.dirty.has('notes')) return;
  const mine = state.dirty.get('notes');
  const before = it.notes;
  if (mine === before) { state.dirty.delete('notes'); return; }
  try {
    await patchItem(it, { notes: mine }, { label: 'Notes', undo: false, quiet: true });
    state.dirty.delete('notes');
    render({ keepDetail: true });
  } catch (err) {
    if (err.code === 'revision_conflict') {
      const latest = get(it.id);
      if (latest.notes === before) {          // a different field changed: re-apply ours
        try { await patchItem(latest, { notes: mine }, { label: 'Notes', undo: false, quiet: true }); state.dirty.delete('notes'); render({ keepDetail: true }); return; } catch (e2) { failure(e2, 'Notes'); }
      }
      state.conflict = { field: 'notes', mine };
      render({ keepDetail: true });
    } else failure(err, 'Notes');
  }
}

/* =================================================================== drag & drop (pointer events; mouse, pen, touch long-press) */
const drag = { pending: null, active: null };
document.addEventListener('pointerdown', (e) => {
  if (e.button !== 0 || drag.active) return;
  const card = e.target.closest('[data-card]');
  if (!card || e.target.closest('button, a, input, select, textarea')) return;
  if (card.closest('[data-board-kind="dates"]')) return;     // read-only grouping
  drag.pending = { card, id: card.dataset.id, x: e.clientX, y: e.clientY, touch: e.pointerType === 'touch', t: Date.now() };
});
document.addEventListener('pointermove', (e) => {
  if (drag.pending && !drag.active) {
    const p = drag.pending;
    const dist = Math.hypot(e.clientX - p.x, e.clientY - p.y);
    if (p.touch && Date.now() - p.t < 320) { if (dist > 10) drag.pending = null; return; }
    if (dist < 5) return;
    startDrag(p, e);
  }
  if (drag.active) { e.preventDefault(); moveDrag(e.clientX, e.clientY); }
});
document.addEventListener('pointerup', (e) => {
  if (drag.active) { finishDrag(); suppressClick = true; setTimeout(() => { suppressClick = false; }, 0); }
  drag.pending = null;
});
document.addEventListener('pointercancel', () => cancelDrag());
let suppressClick = false;
function startDrag(p, e) {

  ghost.classList.add('ghost'); ghost.removeAttribute('data-card'); ghost.style.width = rect.width + 'px';
  ghost.insertAdjacentHTML('beforeend', '<span class="ghost-badge">Reorder</span>');
  document.body.appendChild(ghost);
  const ph = document.createElement('div'); ph.className = 'placeholder'; ph.style.height = rect.height + 'px';
  p.card.after(ph); p.card.classList.add('drag-hidden');
  document.body.classList.add('dragging');
  drag.active = { ...p, ghost, ph, dx: e.clientX - rect.left, dy: e.clientY - rect.top, target: null, kind: p.card.closest('[data-board-kind]')?.dataset.boardKind || 'status' };
  moveDrag(e.clientX, e.clientY);
}
function moveDrag(x, y) {
  const a = drag.active;
  a.ghost.style.left = (x - a.dx) + 'px'; a.ghost.style.top = (y - a.dy) + 'px';
  document.querySelectorAll('.drop-active').forEach((el) => el.classList.remove('drop-active'));
  const el = document.elementFromPoint(x, y);
  const badge = a.ghost.querySelector('.ghost-badge');
  const item = get(a.id);
  const tab = el && el.closest('[data-drop-tab]');
  if (tab && a.kind === 'status') {
    tab.classList.add('drop-active');
    a.target = { kind: 'tab', key: tab.dataset.dropTab };
    badge.textContent = `Move to top of ${ST[tab.dataset.dropTab].label}`;
    return;
  }
  const col = el && el.closest('[data-drop-col]');
  if (!col || (a.kind === 'lists') !== Boolean(col.dataset.list)) { a.target = null; badge.textContent = 'Drop on a column · Esc cancels'; return; }
  col.classList.add('drop-active');
  const key = col.dataset.dropCol;
  const list = col.querySelector('[data-col-list]');
  if (!list) {
    a.target = { kind: 'col', key, index: 0, ids: [] };

const typing = (el) => el && (el.matches('input, textarea, select') || el.isContentEditable);

    if (e.key === 'Escape') { e.preventDefault(); return closeMenu(); }
    if (e.key === 'ArrowDown') { e.preventDefault(); return items[(i + 1) % items.length]?.focus(); }

    state.focusKey = `step:${t.dataset.stepKey}`;
    try { await patchItem(it, { steps }, { label: 'Reorder steps' }); } catch (err) { failure(err, 'Reorder steps'); }
    document.querySelector(`[data-focus-key="step:${t.dataset.stepKey}"]`)?.focus();
    return;
  }
  if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === 'z' && !typing(t)) { e.preventDefault(); return undoLast(); }
  if (typing(t)) { if (e.key === 'Escape') t.blur(); return; }
  if (e.key === 'Escape' && state.selected) { e.preventDefault(); return closeDetail(); }

  const card = t.closest && t.closest('[data-card]');
  if (card && t === card) {
    const it = get(card.dataset.id);
    const isLists = state.boardMode !== 'status' && state.view === 'board';
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); return openDetail(it.id); }
    if (e.key === 'm' || e.key === 'M') { e.preventDefault(); return openMoveMenu(it.id, card.querySelector('[data-menu]') || card); }
    if (!isLists && e.altKey && (e.key === 'ArrowUp' || e.key === 'ArrowDown')) {
      e.preventDefault();
      const a = stepAnchors(column(it.status).map((x) => x.id), it.id, e.key === 'ArrowUp' ? -1 : 1);
      if (!a) { announce(e.key === 'ArrowUp' ? 'Already at the top.' : 'Already at the bottom.'); return; }
      state.focusKey = `card:${it.id}`;
      return moveItem(it, it.status, a);
    }
    if (!isLists && e.altKey && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
      e.preventDefault();
      const next = ORDER[ORDER.indexOf(it.status) + (e.key === 'ArrowLeft' ? -1 : 1)];
      if (!next) return;
      state.focusKey = `card:${it.id}`; state.mobileCol = next;
      return moveItem(it, next, { place: 'top' });
    }
    if (!e.altKey && (e.key === 'ArrowUp' || e.key === 'ArrowDown')) {
      e.preventDefault();
      const cards = [...card.parentElement.querySelectorAll('[data-card]')];
      return cards[cards.indexOf(card) + (e.key === 'ArrowUp' ? -1 : 1)]?.focus();
    }
    if (!e.altKey && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
      e.preventDefault();
      const cols = [...document.querySelectorAll('[data-drop-col]:not(.is-collapsed)')];
      const col = card.closest('[data-drop-col]');
      const pos = [...col.querySelectorAll('[data-card]')].indexOf(card);
      let ci = cols.indexOf(col);
      for (;;) {
        ci += e.key === 'ArrowLeft' ? -1 : 1;
        const target = cols[ci]; if (!target) return;
        const cards = [...target.querySelectorAll('[data-card]')];
        if (cards.length) return cards[Math.min(pos, cards.length - 1)].focus();
      }
    }
  }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === 'n' || e.key === 'N') { e.preventDefault(); return openCapture(); }
  if (e.key === '?') { e.preventDefault(); return openShortcuts(); }
  if (e.key === '/') { e.preventDefault(); return document.getElementById('search').focus(); }
  const v = VIEWS.find((x) => x.key === e.key);
  if (v) { e.preventDefault(); return setView(v.id); }
});

/* =================================================================== boot */
try { setAppearance(new URLSearchParams(location.search).get('appearance') || localStorage.getItem('hq.mock.appearance') || 'system'); } catch (_) { setAppearance('system'); }
(() => {
  const p = new URLSearchParams(location.search);
  if (p.get('view')) state.view = p.get('view');
  if (p.get('board')) state.boardMode = p.get('board');
  if (p.get('col')) state.mobileCol = p.get('col');
  if (p.get('mock') === 'closed') document.getElementById('mock').open = false;
  else if (p.get('mock') === 'open') document.getElementById('mock').open = true;
  load();
  render();
  if (p.get('open')) openDetail(p.get('open'));
  if (p.get('state') === 'offline') setConnection('offline');
})();
window.__workMock = { executionCalls: () => EXECUTION_CALLS, server, state };
</script>
