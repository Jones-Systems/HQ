<!doctype html>
<!-- Fictional artwork source for the HQ visual-system mockups. "Larkspur Tea Co." is invented sample content.
     Rendered once to ../larkspur-landing-{light,dark}.png by tools/render_artwork.sh; the PNG bytes are the artwork. -->
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;width:1440px;height:900px;overflow:hidden}
  body{font-family:"Liberation Serif",Georgia,serif;background:var(--bg);color:var(--ink)}
  .light{--bg:#F3EBDD;--ink:#3B1F4A;--soft:#7A5F86;--accent:#6E4FBF;--accent2:#C8643B;--card:#FFF8EE;--line:#DCCDB6}
  .dark{--bg:#1A1226;--ink:#F3EBDD;--soft:#BFAFC8;--accent:#F2A93B;--accent2:#E07A52;--card:#261B36;--line:#3C2D52}
  nav{display:flex;align-items:center;gap:48px;padding:36px 96px;font:500 17px "Liberation Sans",Arial,sans-serif;color:var(--soft)}
  nav b{font:700 26px "Liberation Serif",serif;color:var(--ink);margin-right:auto;letter-spacing:.02em}
  nav span:last-child{border:1.5px solid var(--ink);color:var(--ink);padding:10px 22px;border-radius:999px}
  .hero{display:grid;grid-template-columns:1.1fr .9fr;gap:64px;padding:56px 96px 0;align-items:center}
  .kicker{font:700 15px "Liberation Sans",sans-serif;letter-spacing:.24em;text-transform:uppercase;color:var(--accent2)}
  h1{font-size:92px;line-height:.98;margin:22px 0 28px;font-weight:700;letter-spacing:-.02em}
  h1 em{color:var(--accent);font-style:italic}
  p{font:400 22px/1.5 "Liberation Sans",sans-serif;color:var(--soft);max-width:560px;margin:0 0 40px}
  .cta{display:inline-block;background:var(--accent);color:var(--bg);font:700 19px "Liberation Sans",sans-serif;padding:20px 36px;border-radius:999px}
  .art{position:relative;height:560px}
  .disc{position:absolute;border-radius:50%}
  .d1{width:440px;height:440px;right:20px;top:30px;background:var(--accent);opacity:.92}
  .d2{width:250px;height:250px;left:10px;top:250px;background:var(--accent2)}
  .d3{width:140px;height:140px;right:70px;top:400px;background:var(--card);border:2px solid var(--line)}
  .cup{position:absolute;left:150px;top:120px;width:300px;height:300px;border-radius:0 0 150px 150px;background:var(--card);border:3px solid var(--ink)}
  .cup::after{content:"";position:absolute;right:-70px;top:60px;width:70px;height:110px;border:3px solid var(--ink);border-left:0;border-radius:0 60px 60px 0}
  .strip{position:absolute;left:0;right:0;bottom:0;height:120px;border-top:1px solid var(--line);display:flex;gap:96px;align-items:center;padding:0 96px;font:500 18px "Liberation Sans",sans-serif;color:var(--soft)}
  .strip b{color:var(--ink);font:700 30px "Liberation Serif",serif;display:block}
</style></head>
<body><script>document.body.className=new URLSearchParams(location.search).get('variant')==='dark'?'dark':'light'</script>
<nav><b>Larkspur Tea Co.</b><span>Blends</span><span>Tasting nights</span><span>Visit</span><span>Reserve a seat</span></nav>
<section class="hero"><div><div class="kicker">Spring tasting · Fictional sample</div>
<h1>Steep slower.<br><em>Taste the season.</em></h1>
<p>Six new spring blends poured side by side, with notes from the people who grew them.</p>
<span class="cta">Reserve a tasting seat</span></div>
<div class="art"><div class="disc d1"></div><div class="disc d2"></div><div class="cup"></div><div class="disc d3"></div></div></section>
<div class="strip"><div><b>6</b>spring blends</div><div><b>Thu–Sat</b>evening pours</div><div><b>12</b>seats a night</div></div>
</body></html>
