<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HQ visual system — components and states</title>
  <link rel="stylesheet" href="_mockup.css">
  <link rel="stylesheet" href="../tokens/hq-tokens.css">
  <link rel="stylesheet" href="../components/hq-components.css">
</head>
<!-- Specimen sheet. The same specimens render in a light and a dark subtree ([data-theme] scopes light-dark()).
     .is-hover / .is-pressed / .is-focus pin interactive states that normally come from :hover, :active, :focus-visible. -->
<body class="sheet-page">
<div class="sheet-pair">
  <div class="sheet-side" data-theme="light"></div>
  <div class="sheet-side" data-theme="dark"></div>
</div>
<template id="specimens">
  <header class="sheet-section">
    <span class="hq-eyebrow" data-mode-label></span>
    <h1 class="hq-display">Components and states</h1>
    <span class="hq-meta">HQ visual system 0.1.0-draft · fictional content</span>
  </header>

  <section class="sheet-section">
    <header><span class="hq-heading">Type</span><span class="hq-meta">IBM Plex Sans / Plex Mono</span></header>
    <div style="display:grid;gap:6px">
      <span class="hq-display">Display 24/30 Spring launch</span>
      <span class="hq-title">Title 17/24 Channel insights</span>
      <span class="hq-heading">Heading 14/20 Choose the hero photo</span>
      <span>Body 13/20 Six new spring blends poured side by side.</span>
      <span class="hq-label">Label 12/16 Open canvas</span>
      <span class="hq-eyebrow">Eyebrow 10.5/14 Project</span>
      <span class="hq-meta">Meta 11/16 rev 7c41e2a · 18 Oct 2026 14:02</span>
    </div>
  </section>

  <section class="sheet-section">
    <header><span class="hq-heading">Roles</span><span class="hq-meta">surfaces · text · signal · status</span></header>
    <div class="sheet-grid sheet-swatches">
      <div class="swatch"><i style="background:var(--hq-canvas)"></i><span class="hq-meta">canvas</span></div>
      <div class="swatch"><i style="background:var(--hq-nav)"></i><span class="hq-meta">nav</span></div>
      <div class="swatch"><i style="background:var(--hq-surface)"></i><span class="hq-meta">surface</span></div>
      <div class="swatch"><i style="background:var(--hq-surface-raised)"></i><span class="hq-meta">raised</span></div>
      <div class="swatch"><i style="background:var(--hq-surface-overlay)"></i><span class="hq-meta">overlay</span></div>
      <div class="swatch"><i style="background:var(--hq-surface-sunken)"></i><span class="hq-meta">sunken</span></div>
      <div class="swatch"><i style="background:var(--hq-text)"></i><span class="hq-meta">text</span></div>
      <div class="swatch"><i style="background:var(--hq-text-muted)"></i><span class="hq-meta">text-muted</span></div>
      <div class="swatch"><i style="background:var(--hq-text-subtle)"></i><span class="hq-meta">text-subtle</span></div>
      <div class="swatch"><i style="background:var(--hq-border-control)"></i><span class="hq-meta">border-control</span></div>
      <div class="swatch"><i style="background:var(--hq-accent)"></i><span class="hq-meta">accent</span></div>
      <div class="swatch"><i style="background:var(--hq-accent-text)"></i><span class="hq-meta">accent-text</span></div>
      <div class="swatch"><i style="background:var(--hq-focus)"></i><span class="hq-meta">focus</span></div>
      <div class="swatch"><i style="background:var(--hq-success)"></i><span class="hq-meta">success</span></div>
      <div class="swatch"><i style="background:var(--hq-warning)"></i><span class="hq-meta">warning</span></div>
      <div class="swatch"><i style="background:var(--hq-danger)"></i><span class="hq-meta">danger</span></div>
      <div class="swatch"><i style="background:var(--hq-info)"></i><span class="hq-meta">info</span></div>
      <div class="swatch"><i style="background:var(--hq-artwork-matte)"></i><span class="hq-meta">matte (fixed)</span></div>
    </div>
  </section>

  <section class="sheet-section">
    <header><span class="hq-heading">Buttons</span><span class="hq-meta">30px · 24px small</span></header>
    <div class="sheet-grid sheet-states">
      <span></span><span class="hq-meta">Rest</span><span class="hq-meta">Hover</span><span class="hq-meta">Pressed</span><span class="hq-meta">Focus</span><span class="hq-meta">Disabled</span><span class="hq-meta">Busy</span>
      <span class="hq-meta">Primary</span>
      <span><button class="hq-btn hq-btn--primary">Capture</button></span><span><button class="hq-btn hq-btn--primary is-hover">Capture</button></span><span><button class="hq-btn hq-btn--primary is-pressed">Capture</button></span><span><button class="hq-btn hq-btn--primary is-focus">Capture</button></span><span><button class="hq-btn hq-btn--primary" disabled>Capture</button></span><span><button class="hq-btn hq-btn--primary" aria-busy="true"><span class="hq-spinner"></span>Saving</button></span>
      <span class="hq-meta">Secondary</span>
      <span><button class="hq-btn hq-btn--secondary">Compare</button></span><span><button class="hq-btn hq-btn--secondary is-hover">Compare</button></span><span><button class="hq-btn hq-btn--secondary is-pressed">Compare</button></span><span><button class="hq-btn hq-btn--secondary is-focus">Compare</button></span><span><button class="hq-btn hq-btn--secondary" disabled>Compare</button></span><span><button class="hq-btn hq-btn--secondary" aria-busy="true"><span class="hq-spinner"></span>Loading</button></span>
      <span class="hq-meta">Ghost</span>
      <span><button class="hq-btn hq-btn--ghost">Check</button></span><span><button class="hq-btn hq-btn--ghost is-hover">Check</button></span><span><button class="hq-btn hq-btn--ghost is-pressed">Check</button></span><span><button class="hq-btn hq-btn--ghost is-focus">Check</button></span><span><button class="hq-btn hq-btn--ghost" disabled>Check</button></span><span><button class="hq-btn hq-btn--ghost" aria-busy="true"><span class="hq-spinner"></span>Checking</button></span>
      <span class="hq-meta">Danger</span>
      <span><button class="hq-btn hq-btn--danger">Remove</button></span><span><button class="hq-btn hq-btn--danger is-hover">Remove</button></span><span><button class="hq-btn hq-btn--danger is-pressed">Remove</button></span><span><button class="hq-btn hq-btn--danger is-focus">Remove</button></span><span><button class="hq-btn hq-btn--danger" disabled>Remove</button></span><span><button class="hq-btn hq-btn--danger" aria-busy="true"><span class="hq-spinner"></span>Removing</button></span>
    </div>
  </section>

  <section class="sheet-section">
    <header><span class="hq-heading">Fields and appearance</span></header>
    <div class="sheet-grid" style="grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 16px;align-items:start">
      <div class="hq-field"><label>Rest</label><input class="hq-input" placeholder="Card title"></div>
      <div class="hq-field"><label>Focus</label><input class="hq-input is-focus" value="Tasting-night signage"></div>
      <div class="hq-field"><label>Invalid</label><input class="hq-input" aria-invalid="true" value=""><span class="hq-field-msg hq-field-msg--error">Title is required</span></div>
      <div class="hq-field"><label>Disabled</label><input class="hq-input" disabled value="Locked by import"></div>
      <div class="hq-field"><label>Read-only</label><input class="hq-input" readonly value="rev 7c41e2a"></div>
      <div class="hq-field"><label>Appearance</label>
        <div class="hq-segmented" role="radiogroup" aria-label="Appearance">
          <button role="radio" aria-checked="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.6"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></svg>Light</button>
          <button role="radio" aria-checked="false"><svg viewBox="0 0 24 24"><path d="M19.5 14.5A7.5 7.5 0 0 1 9.5 4.5a7.5 7.5 0 1 0 10 10Z"/></svg>Dark</button>
          <button role="radio" aria-checked="true"><svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="11.5" rx="1.5"/><path d="M9 20h6M12 16v4"/></svg>System</button>
        </div>
      </div>
    </div>
  </section>

  <section class="sheet-section">
    <header><span class="hq-heading">Rail and secondary navigation</span></header>
    <div class="sheet-row" style="align-items:start">
      <div class="mini-rail">
        <figure><a class="hq-rail-item"><svg viewBox="0 0 24 24"><path d="M4 7.5h16M4 16.5h16M7.5 4v16M16.5 4v16"/></svg><span>Design</span></a><span class="hq-meta">Rest</span></figure>
        <figure><a class="hq-rail-item is-hover"><svg viewBox="0 0 24 24"><path d="M4 7.5h16M4 16.5h16M7.5 4v16M16.5 4v16"/></svg><span>Design</span></a><span class="hq-meta">Hover</span></figure>
        <figure><a class="hq-rail-item" aria-current="page"><svg viewBox="0 0 24 24"><path d="M4 7.5h16M4 16.5h16M7.5 4v16M16.5 4v16"/></svg><span>Design</span></a><span class="hq-meta">Current</span></figure>
        <figure><a class="hq-rail-item is-focus"><svg viewBox="0 0 24 24"><path d="M4 7.5h16M4 16.5h16M7.5 4v16M16.5 4v16"/></svg><span>Design</span></a><span class="hq-meta">Focus</span></figure>
        <figure><a class="hq-rail-item" aria-disabled="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.2"/><path d="M8.2 8.2a5.4 5.4 0 0 0 0 7.6M15.8 8.2a5.4 5.4 0 0 1 0 7.6M5.3 5.3a9.5 9.5 0 0 0 0 13.4M18.7 5.3a9.5 9.5 0 0 1 0 13.4"/></svg><span>Social</span></a><span class="hq-meta">Unavailable</span></figure>
      </div>
      <div class="mini-nav" style="width:210px">
        <a class="hq-nav-item">Rest<span class="hq-count">12</span></a>
        <a class="hq-nav-item is-hover">Hover</a>
        <a class="hq-nav-item" aria-current="page">Current</a>
        <a class="hq-nav-item is-focus">Focus</a>
      </div>
      <span class="hq-tooltip">Social is not installed in this build</span>
    </div>
  </section>

  <section class="sheet-section">
    <header><span class="hq-heading">Source freshness and saving</span><span class="hq-meta">shape + word, never colour alone</span></header>
    <div class="sheet-grid" style="grid-template-columns:1fr 1fr;gap:10px 24px">
      <span class="hq-fresh hq-fresh--fresh"><b>Fresh</b> observed 2 min ago</span>
      <span class="hq-save"><svg viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>Saved 14:02</span>
      <span class="hq-fresh hq-fresh--stale"><b>Stale</b> last observed 3 days ago</span>
      <span class="hq-save hq-save--saving"><span class="hq-spinner"></span>Saving…</span>
      <span class="hq-fresh hq-fresh--unknown"><b>Unknown</b> dispatch not confirmed</span>
      <span class="hq-save hq-save--unsaved">Unsaved changes</span>
      <span class="hq-fresh hq-fresh--unavailable"><b>Unavailable</b> host offline</span>
      <span class="hq-save hq-save--failed">Not saved · <button>Retry</button></span>
    </div>
  </section>

  <section class="sheet-section">
    <header><span class="hq-heading">Feedback</span></header>
    <div style="display:grid;gap:10px">
      <div class="hq-banner hq-banner--info"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5M12 8h.01"/></svg><div><strong>Different project</strong><p>This reference belongs to Atlas Weekend Market. Opening it switches project visibly.</p></div><button class="hq-btn hq-btn--ghost hq-btn--sm">Open</button></div>
      <div class="hq-banner hq-banner--warning"><svg viewBox="0 0 24 24"><path d="M12 4 21 19H3z"/><path d="M12 10v4M12 17h.01"/></svg><div><strong>Status is stale</strong><p>Last observed 16 Oct 09:40. Nothing was retried.</p></div><button class="hq-btn hq-btn--ghost hq-btn--sm">Check</button></div>
      <div class="hq-banner hq-banner--danger"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="m9 9 6 6M15 9l-6 6"/></svg><div><strong>Couldn't save the board</strong><p>Your last move is kept on this device. Retry when storage is available.</p></div><button class="hq-btn hq-btn--secondary hq-btn--sm">Retry</button></div>
      <div class="sheet-row"><div class="hq-toast" role="status"><div>Moved “Choose the hero photo” to Active<span class="hq-meta">Planning change only · no run started</span></div><button class="hq-btn hq-btn--secondary hq-btn--sm">Undo</button></div></div>
    </div>
  </section>

  <section class="sheet-section">
    <header><span class="hq-heading">Empty, loading, error</span></header>
    <div class="sheet-grid" style="grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:stretch">
      <section class="hq-panel"><div class="hq-empty"><span class="hq-empty-glyph"><svg viewBox="0 0 24 24"><path d="M4 13h4l1.5 2.5h5L16 13h4M4 13l2.5-7h11L20 13v6H4z"/></svg></span><strong>Inbox is clear</strong><p>Captured ideas land here until you sort them.</p><button class="hq-btn hq-btn--secondary hq-btn--sm">Capture</button></div></section>
      <section class="hq-panel" aria-busy="true"><div class="hq-panel-body" style="display:grid;gap:10px"><span class="hq-save hq-save--saving"><span class="hq-spinner"></span>Loading references</span><span class="hq-skeleton" style="width:80%"></span><span class="hq-skeleton" style="width:95%"></span><span class="hq-skeleton" style="width:60%"></span><span class="hq-skeleton" style="width:70%"></span></div></section>
      <section class="hq-panel"><div class="hq-empty"><span class="hq-empty-glyph" style="border-color:var(--hq-danger);color:var(--hq-danger)"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 8v5M12 16h.01"/></svg></span><strong>Couldn't load drafts</strong><p>The Social store did not respond. Nothing was changed.</p><button class="hq-btn hq-btn--secondary hq-btn--sm">Try again</button></div></section>
    </div>
  </section>

  <section class="sheet-section">
    <header><span class="hq-heading">Work card and references</span><span class="hq-meta">drag and keyboard move are planning-only</span></header>
    <div class="sheet-cards">
      <figure><article class="hq-card"><p class="hq-card-title">Write menu card copy</p><div class="hq-card-row"><span class="hq-chip">SOON</span><span class="hq-chip hq-chip--quiet">Target · 24 Oct</span></div></article><span class="hq-meta">Rest</span></figure>
      <figure><article class="hq-card is-hover"><p class="hq-card-title">Write menu card copy</p><div class="hq-card-row"><span class="hq-chip">SOON</span><span class="hq-chip hq-chip--quiet">Target · 24 Oct</span></div></article><span class="hq-meta">Hover</span></figure>
      <figure><article class="hq-card" aria-selected="true"><p class="hq-card-title">Write menu card copy</p><div class="hq-card-row"><span class="hq-chip">SOON</span><span class="hq-chip hq-chip--quiet">Target · 24 Oct</span></div></article><span class="hq-meta">Selected</span></figure>
      <figure><article class="hq-card is-focus"><p class="hq-card-title">Write menu card copy</p><div class="hq-card-row"><span class="hq-chip">SOON</span><span class="hq-chip hq-chip--quiet">Target · 24 Oct</span></div></article><span class="hq-meta">Focus · keyboard move</span></figure>
      <figure><article class="hq-card is-dragging"><p class="hq-card-title">Write menu card copy</p><div class="hq-card-row"><span class="hq-chip">SOON</span><span class="hq-chip hq-chip--quiet">Target · 24 Oct</span></div></article><span class="hq-meta">Dragging</span></figure>
      <figure><div class="hq-card-slot"></div><span class="hq-meta">Drop position</span></figure>
      <figure><div class="hq-ref"><span class="hq-ref-top"><b>Design</b><span class="hq-ref-title">Landing — hero</span></span><span class="hq-ref-meta">Capture · rev 7c41e2a</span></div><span class="hq-meta">Same project</span></figure>
      <figure><div class="hq-ref hq-ref--other"><span class="hq-ref-top"><b>Design</b><span class="hq-ref-title">Stall layout v2</span></span><span class="hq-ref-meta">Other project · Atlas Weekend Market</span></div><span class="hq-meta">Other project</span></figure>
      <figure><div class="hq-ref hq-ref--missing"><span class="hq-ref-top"><b>Social</b><span class="hq-ref-title">Supplier note</span></span><span class="hq-ref-meta">Target unavailable · snapshot 9 Oct</span></div><span class="hq-meta">Missing target</span></figure>
    </div>
  </section>
</template>
<script>
  const tpl = document.getElementById('specimens');
  document.querySelectorAll('.sheet-side').forEach((side) => {
    side.append(tpl.content.cloneNode(true));
    side.querySelector('[data-mode-label]').textContent = `${side.dataset.theme} chrome`;
  });
  document.fonts.ready.then(() => setTimeout(() => {
    document.title = JSON.stringify({ hqEvidence: 1, fonts: document.fonts.check('13px "IBM Plex Sans"'), height: document.documentElement.scrollHeight, rects: {} });
  }, 50));
</script>
</body>
</html>
