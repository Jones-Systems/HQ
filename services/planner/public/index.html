<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121418" media="(prefers-color-scheme: dark)">
  <meta name="referrer" content="no-referrer">
  <title>Planning</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Planning navigation"></aside>
    <div class="main-col">
      <header class="topbar" id="topbar"></header>
      <div id="banner" class="banner-host"></div>
      <div id="filter-chips" class="filter-chips" hidden></div>
      <main id="main" class="main" tabindex="-1"></main>
    </div>
    <aside id="detail" class="detail" hidden aria-label="Item details"></aside>
  </div>
  <nav class="tabbar" id="tabbar" aria-label="Views"></nav>
  <button type="button" class="fab" id="fab" aria-label="New item">
    <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false" class="icon"><path d="M12 5v14M5 12h14"/></svg>
  </button>
  <div id="toasts" class="toasts"></div>
  <div id="live-region" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  <noscript><p class="noscript">This planning hub needs JavaScript enabled.</p></noscript>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
