<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Taste review harness</title>
    <style>
      /* Mirrors the HQ shell tokens so the panel renders as it would when mounted. */
      :root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color-scheme: light;
        --background: #f8f9fb; --surface: #ffffff; --text: #20232a; --muted: #69717e; --line: #e2e5eb; --selected: #e9edf6; --accent: #516aa2;
        color: var(--text); background: var(--background); }
      :root[data-theme="dark"] { color-scheme: dark; --background: #17191d; --surface: #1d2025; --text: #eceef2; --muted: #a2a9b5; --line: #30353d; --selected: #2b3446; --accent: #a2b8ee; }
      body { margin: 0; }
      button, select { font: inherit; color: inherit; }
      button { cursor: pointer; }
      .eyebrow { text-transform: uppercase; letter-spacing: 1.7px; color: var(--accent); font-size: 10px; font-weight: 650; }
      .harness-bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 10px 24px; border-bottom: 1px dashed var(--line); font-size: 12px; color: var(--muted); }
      .harness-bar strong { color: var(--text); }
      .harness-bar button { background: var(--surface); border: 1px solid var(--line); border-radius: 5px; padding: 4px 10px; font-size: 12px; }
      main { padding: 40px clamp(24px, 6vw, 72px); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
